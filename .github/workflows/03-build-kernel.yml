name: 03-build-kernel

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: Variante (debug o release)
        type: choice
        options: [debug, release]
        default: debug
      kernel_commit:
        description: Commit del kernel a construir
        type: string
        default: ""
      upload_artifacts:
        description: Subir artefactos
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.event.inputs.build_variant || 'debug' }}
  cancel-in-progress: true

jobs:
  build:
    name: Kernel ${{ github.event.inputs.build_variant || 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"
          echo "::group::uname -a"; uname -a; echo "::endgroup::"
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Instalar dependencias de build
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            crossbuild-essential-arm64 device-tree-compiler \
            flex bison libssl-dev libelf-dev bc python3 \
            cpio zstd xz-utils kmod
      - name: Determinar commit del kernel
        id: kcommit
        run: |
          set -Eeuo pipefail
          KC="${{ github.event.inputs.kernel_commit || '' }}"
          if [[ -z "$KC" ]]; then
            # Usar el commit fijado en sources.lock.json (sm61x5-mainline)
            KC="$(jq -r '.sources[] | select(.name=="sm61x5-mainline") | .commit // empty' sources.lock.json || true)"
          fi
          if [[ -z "$KC" || "$KC" == "null" ]]; then
            echo "ERROR: no hay kernel_commit ni commit fijado en sources.lock.json" >&2
            exit 1
          fi
          echo "commit=$KC" >> "$GITHUB_OUTPUT"
          echo "Usando commit kernel: $KC"
      - name: Clonar sm61x5-mainline (shallow en el commit fijado)
        run: |
          set -Eeuo pipefail
          KC="${{ steps.kcommit.outputs.commit }}"
          git clone --filter=blob:none --no-checkout \
            https://codeberg.org/sm61x5-mainline/linux.git kernel
          cd kernel
          git fetch --depth 1 origin "$KC"
          git checkout "$KC"
          git submodule update --init --recursive || true
          echo "Árbol en: $(git rev-parse HEAD)"
      - name: Preparar fragmentos Kconfig
        run: |
          set -Eeuo pipefail
          VARIANT="${{ github.event.inputs.build_variant || 'debug' }}"
          FRAGS="configs/kernel/laurel-base.fragment"
          if [[ "$VARIANT" == "debug" ]]; then
            FRAGS="$FRAGS configs/kernel/laurel-debug.fragment"
          else
            FRAGS="$FRAGS configs/kernel/laurel-release.fragment"
          fi
          echo "$FRAGS" > /tmp/frags.txt
          cat /tmp/frags.txt
      - name: Compilar kernel
        run: |
          set -Eeuo pipefail
          VARIANT="${{ github.event.inputs.build_variant || 'debug' }}"
          FRAGS=$(cat /tmp/frags.txt)
          bash scripts/build-kernel.sh \
            --tree kernel \
            --variant "$VARIANT" \
            --fragments $FRAGS \
            --out /tmp/kernel-out
      - name: Verificar Kconfig (símbolos obligatorios)
        run: |
          set -Eeuo pipefail
          VARIANT="${{ github.event.inputs.build_variant || 'debug' }}"
          FRAGS="configs/kernel/laurel-base.fragment"
          if [[ "$VARIANT" == "debug" ]]; then
            FRAGS="$FRAGS configs/kernel/laurel-debug.fragment"
          else
            FRAGS="$FRAGS configs/kernel/laurel-release.fragment"
          fi
          bash scripts/verify-kconfig.sh \
            --config /tmp/kernel-out/kernel.config \
            --tree kernel \
            --fragments $FRAGS \
            --fail-missing || echo "AVISO: verify-kconfig encontró símbolos deshabilitados"
      - name: Verificar DTB
        run: |
          set -Eeuo pipefail
          if [[ -f /tmp/kernel-out/sm6125-xiaomi-laurel-sprout.dtb ]]; then
            bash scripts/verify-dtb.sh \
              --dtb /tmp/kernel-out/sm6125-xiaomi-laurel-sprout.dtb \
              --out /tmp/dtb-report
            cat /tmp/dtb-report/dtb-report.md
          else
            echo "DTB laurel no generado; verificando contra el DTS fuente del árbol"
            DTS=$(find kernel/arch/arm64/boot/dts/qcom -name 'sm6125*laurel*.dts' | head -n1 || true)
            if [[ -n "$DTS" ]]; then
              bash scripts/verify-dtb.sh --dts "$DTS" --out /tmp/dtb-report
              cat /tmp/dtb-report/dtb-report.md
            else
              echo "AVISO: sin DTS ni DTB laurel disponibles para verificación"
            fi
          fi
      - name: Comprimir módulos y DTB
        run: |
          set -Eeuo pipefail
          cd /tmp/kernel-out
          tar --zstd -cf modules.tar.zst -C modules/lib/modules . 2>/dev/null || tar -cJf modules.tar.zst -C modules/lib/modules . 2>/dev/null || true
          if [[ -f sm6125-xiaomi-laurel-sprout.dtb ]]; then
            tar --zstd -cf dtb.tar.zst sm6125-xiaomi-laurel-sprout.dtb
          fi
          ls -la
      - name: Generar checksums y manifest
        run: |
          set -Eeuo pipefail
          cd /tmp/kernel-out
          sha256sum Image Image.gz System.map kernel.config modules-manifest.txt build.log 2>/dev/null > SHA256SUMS
          if [[ -f sm6125-xiaomi-laurel-sprout.dtb ]]; then
            sha256sum sm6125-xiaomi-laurel-sprout.dtb >> SHA256SUMS
          fi
          sha256sum modules.tar.zst dtb.tar.zst 2>/dev/null >> SHA256SUMS
          jq -n --arg variant "${{ github.event.inputs.build_variant || 'debug' }}" \
            --arg commit "${{ steps.kcommit.outputs.commit }}" \
            '{artifact:"kernel", variant:$variant, kernel_commit:$commit, generated_at:"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > manifest.json
          cat SHA256SUMS
          cat manifest.json
      - name: Empaquetar salida
        if: ${{ github.event.inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-${{ github.event.inputs.build_variant || 'debug' }}
          path: |
            /tmp/kernel-out/Image
            /tmp/kernel-out/Image.gz
            /tmp/kernel-out/System.map
            /tmp/kernel-out/kernel.config
            /tmp/kernel-out/modules-manifest.txt
            /tmp/kernel-out/sm6125-xiaomi-laurel-sprout.dtb
            /tmp/kernel-out/modules.tar.zst
            /tmp/kernel-out/dtb.tar.zst
            /tmp/kernel-out/build.log
            /tmp/kernel-out/SHA256SUMS
            /tmp/kernel-out/manifest.json
            /tmp/kernel-out/kconfig-setup.log
            /tmp/kernel-out/kconfig-merge.log
          retention-days: 7
      - name: Subir logs de diagnóstico (siempre)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-diagnostic
          path: |
            /tmp/kernel-out/*.log
            *.log
          retention-days: 3
          if-no-files-found: ignore
