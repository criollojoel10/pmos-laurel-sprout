name: 03-build-kernel

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: Variante (debug o release)
        type: choice
        options: [debug, release]
        default: debug
      kernel_commit:
        description: Commit del kernel a construir
        type: string
        default: ""
      upload_artifacts:
        description: Subir artefactos
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.event.inputs.build_variant || 'debug' }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build-kernel.yml
    with:
      build_variant: ${{ github.event.inputs.build_variant || 'debug' }}
      kernel_commit: ${{ github.event.inputs.kernel_commit || '' }}
      upload_artifacts: ${{ github.event.inputs.upload_artifacts != 'false' }}
    secrets: inherit
