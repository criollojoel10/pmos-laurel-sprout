name: 04-build-pmos-phosh

on:
  workflow_dispatch:
    inputs:
      pmaports_commit:
        description: Commit de pmaports
        type: string
        default: ""
      build_variant:
        description: 'debug or release'
        type: string
        default: 'debug'
      upload_artifacts:
        description: Subir artefactos
        type: boolean
        default: true
  workflow_call:
    inputs:
      build_variant:
        description: 'debug or release'
        type: string
        default: 'debug'
    secrets:
      GH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: pmos-phosh
  cancel-in-progress: true

jobs:
  build-kernel:
    name: "Shared kernel (${{ inputs.build_variant || 'debug' }})"
    uses: ./.github/workflows/reusable-build-kernel.yml
    with:
      build_variant: ${{ inputs.build_variant || 'debug' }}
      upload_artifacts: true

  build-phosh:
    name: postmarketOS Edge + Phosh
    needs: build-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"
          echo "::group::uname -a"; uname -a; echo "::endgroup::"
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Determinar commit de pmaports
        id: pcommit
        run: |
          set -Eeuo pipefail
          PC="${{ github.event.inputs.pmaports_commit || '' }}"
          if [[ -z "$PC" ]]; then
            PC="$(jq -r '.sources[] | select(.name=="pmaports") | .commit // empty' sources.lock.json || true)"
          fi
          if [[ -z "$PC" || "$PC" == "null" ]]; then
            echo "ERROR: pmaports_commit no dado ni fijado en sources.lock.json" >&2
            exit 1
          fi
          echo "commit=$PC" >> "$GITHUB_OUTPUT"
      - name: Download kernel artifacts
        # actions/download-artifact@v4.3.3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-${{ inputs.build_variant || 'debug' }}
          path: /tmp/kernel-artifact
      - name: Preparar pmaports
        run: |
          set -Eeuo pipefail
          bash scripts/prepare-pmaports.sh \
            --pmaports /tmp/pmaports \
            --commit "${{ steps.pcommit.outputs.commit }}" \
            --apply-device
      - name: Build contrato Phosh
        run: |
          set -Eeuo pipefail
          bash scripts/build-pmos-console.sh \
            --pmaports /tmp/pmaports \
            --packages configs/pmos/phosh-packages.txt \
            --out /tmp/phosh-out
          cat /tmp/phosh-out/console-build-contract.txt
      - name: Punto de integración pmbootstrap Phosh (placeholder)
        run: |
          set -Eeuo pipefail
          echo "La construcción completa del rootfs Phosh (pmbootstrap install"
          echo "--ui phosh) se desbloquea cuando device/linux-postmarketos-qcom-sm6125"
          echo "y device/device-xiaomi-laurel tengan APKBUILD y deviceinfo reales."
          echo "Este workflow valida el contrato, instala paquetes Phosh y"
          echo "conecta el kernel compartido."
          echo "phosh-contract OK"
      - name: Subir artefactos (si aplica)
        if: ${{ github.event.inputs.upload_artifacts != false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pmos-phosh
          path: /tmp/phosh-out/
          retention-days: 7
      - name: Subir logs de diagnóstico (siempre)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pmos-phosh-diagnostic
          path: |
            *.log
            **/*.log
          retention-days: 3
          if-no-files-found: ignore
