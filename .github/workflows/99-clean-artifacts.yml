name: 99-clean-artifacts

on:
  schedule:
    # Semanal (UTC)
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: clean-artifacts
  cancel-in-progress: false

jobs:
  clean:
    name: Limpiar artefactos expirados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          df -h; echo "---"; uname -a
      - name: Eliminar artefactos expirados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name, .expired, .expires_at, .id] | @tsv' \
            | while IFS=$'\t' read -r name expired expires_at id; do
              if [[ "$expired" == "true" ]]; then
                echo "eliminando artefacto expirado: $name ($id)"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
              fi
            done
          echo "limpieza de artefactos completada"
