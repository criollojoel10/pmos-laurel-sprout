name: 13-build-v71-native-diag-v2

on:
  workflow_dispatch:
    inputs:
      kernel_artifact_run_id:
        description: Run ID 03 con kernel v7.1 y DTB WCN3990
        type: string
        default: "31513653872"
      usb_function:
        description: Función USB del diagnóstico
        type: choice
        options: [rndis, ncm, ecm]
        default: rndis
      preserve_boot_resources:
        description: Añadir clk/pd/regulator_ignore_unused al cmdline
        type: boolean
        default: true
      upload_artifacts:
        description: Subir artefactos
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: v71-native-diag-v2
  cancel-in-progress: true

jobs:
  build:
    name: Initramfs nativo v7.1 v2 observable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"
          echo "::group::uname -a"; uname -a; echo "::endgroup::"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Dependencias
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            device-tree-compiler cpio gzip file python3 \
            crossbuild-essential-arm64 android-sdk-libsparse-utils e2fsprogs
      - name: Descargar kernel-debug
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-debug
          path: /tmp/kernel-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.kernel_artifact_run_id }}
      - name: Verificar config crítica
        run: |
          set -Eeuo pipefail
          cd /tmp/kernel-artifact
          sha256sum -c SHA256SUMS
          for sym in \
            CONFIG_BLK_DEV_INITRD=y CONFIG_DEVTMPFS=y CONFIG_DEVTMPFS_MOUNT=y \
            CONFIG_TMPFS=y CONFIG_PROC_FS=y CONFIG_SYSFS=y CONFIG_RD_GZIP=y \
            CONFIG_SCSI=y CONFIG_SCSI_UFSHCD=y CONFIG_SCSI_UFSHCD_PLATFORM=y \
            CONFIG_SCSI_UFS_QCOM=y CONFIG_PHY_QCOM_QMP=y CONFIG_PHY_QCOM_QMP_UFS=y \
            CONFIG_EXT4_FS=y CONFIG_BLK_DEV_LOOP=y CONFIG_MSDOS_PARTITION=y \
            CONFIG_USB=y CONFIG_USB_ROLE_SWITCH=y CONFIG_USB_DWC3=y \
            CONFIG_USB_DWC3_QCOM=y CONFIG_PHY_QCOM_QUSB2=y CONFIG_USB_GADGET=y \
            CONFIG_USB_LIBCOMPOSITE=y CONFIG_USB_CONFIGFS=y CONFIG_USB_ETH=y \
            CONFIG_USB_ETH_RNDIS=y CONFIG_NET=y CONFIG_INET=y CONFIG_PACKET=y \
            CONFIG_UNIX=y CONFIG_PSTORE=y CONFIG_PSTORE_RAM=y \
            CONFIG_PSTORE_CONSOLE=y CONFIG_PSTORE_PMSG=y CONFIG_MAGIC_SYSRQ=y \
            CONFIG_PRINTK_TIME=y CONFIG_DEBUG_FS=y CONFIG_DYNAMIC_DEBUG=y \
            CONFIG_FB=y CONFIG_FB_SIMPLE=y CONFIG_FRAMEBUFFER_CONSOLE=y \
            CONFIG_VT=y CONFIG_VT_CONSOLE=y \
            CONFIG_COMMON_CLK=y CONFIG_PM_GENERIC_DOMAINS=y \
            CONFIG_REGULATOR=y CONFIG_REGULATOR_FIXED_VOLTAGE=y; do
            grep -qx "$sym" kernel.config || { echo "ERROR: $sym no es =y" >&2; exit 1; }
          done
          case "${{ github.event.inputs.usb_function }}" in
            ecm) grep -qx CONFIG_USB_CONFIGFS_ECM=y kernel.config ;;
            ncm) grep -qx CONFIG_USB_CONFIGFS_NCM=y kernel.config ;;
            rndis) grep -qx CONFIG_USB_CONFIGFS_RNDIS=y kernel.config ;;
          esac || { echo "ERROR: función USB no está built-in" >&2; exit 1; }
          grep -E '^CONFIG_(BLK_DEV_INITRD|USB_DWC3|USB_DWC3_QCOM|PHY_QCOM_QUSB2|USB_CONFIGFS|USB_CONFIGFS_ECM|USB_CONFIGFS_NCM|USB_CONFIGFS_RNDIS|SCSI_UFS_QCOM|EXT4_FS|FB_SIMPLE|FRAMEBUFFER_CONSOLE|VT|COMMON_CLK|PM_GENERIC_DOMAINS|REGULATOR)=' kernel.config > /tmp/config-critical.txt
      - name: Construir BusyBox arm64
        run: |
          set -Eeuo pipefail
          bash scripts/build-busybox-arm64.sh --out /tmp/busybox-out
          file /tmp/busybox-out/busybox
      - name: Construir initramfs nativo v7.1 v2
        run: |
          set -Eeuo pipefail
          bash scripts/build-diagnostic-initramfs.sh \
            --init initramfs/native-diag-init-v2 \
            --busybox-root /tmp/busybox-out/applet-root \
            --usb-function "${{ github.event.inputs.usb_function }}" \
            --out /tmp/initramfs-out
          bash scripts/verify-v71-native-initramfs.sh \
            --ramdisk /tmp/initramfs-out/initramfs.cpio.gz \
            --busybox-root /tmp/busybox-out/applet-root \
            --out /tmp/initramfs-out
          gzip -dc /tmp/initramfs-out/initramfs.cpio.gz | cpio -t > /tmp/initramfs-file-list.txt
      - name: Ensamblar boot nativo v7.1 v2
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event.inputs.preserve_boot_resources }}" == "true" ]]; then
            RESOURCES="clk_ignore_unused pd_ignore_unused regulator_ignore_unused"
          else
            RESOURCES=""
          fi
          CMDLINE="console=ttyMSM0,115200n8 console=tty0 consoleblank=0 ignore_loglevel loglevel=8 initcall_debug printk.time=1 panic=10 $RESOURCES androidboot.hardware=qcom androidboot.console=ttyMSM0 loop.max_part=7 buildvariant=user"
          echo "$CMDLINE" > /tmp/cmdline.txt
          echo "cmdline: $CMDLINE"
          mkdir -p /tmp/boot-out
          python3 scripts/build-boot-image.py \
            --kernel /tmp/kernel-artifact/Image.gz \
            --ramdisk /tmp/initramfs-out/initramfs.cpio.gz \
            --dtb /tmp/kernel-artifact/sm6125-xiaomi-laurel-sprout.dtb \
            --out /tmp/boot-out/boot-laurel-v71-native-diag-v2.img \
            --base 0x00000000 --page-size 4096 \
            --kernel-offset 0x00008000 --ramdisk-offset 0x01000000 \
            --tags-offset 0x00000100 --dtb-offset 0x0000000001f00000 \
            --os-version 12.0.0 --os-patch-level 2026-08 \
            --cmdline "$CMDLINE"
      - name: Validación final y extracción
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-diagnostic-boot.py \
            --boot /tmp/boot-out/boot-laurel-v71-native-diag-v2.img \
            --kernel /tmp/kernel-artifact/Image.gz \
            --ramdisk /tmp/initramfs-out/initramfs.cpio.gz \
            --dtb /tmp/kernel-artifact/sm6125-xiaomi-laurel-sprout.dtb \
            --out /tmp/boot-validation
          bash scripts/verify-v71-native-initramfs.sh \
            --ramdisk /tmp/initramfs-out/initramfs.cpio.gz \
            --busybox-root /tmp/busybox-out/applet-root \
            --out /tmp/boot-validation/native
          CMDLINE="$(python3 scripts/unpack-boot-image.py --boot /tmp/boot-out/boot-laurel-v71-native-diag-v2.img --out /tmp/boot-validation/unpack --print-cmdline)"
          grep -q 'console=tty0' <<<"$CMDLINE"
          grep -q 'consoleblank=0' <<<"$CMDLINE"
          if [[ "${{ github.event.inputs.preserve_boot_resources }}" == "true" ]]; then
            for tok in clk_ignore_unused pd_ignore_unused regulator_ignore_unused; do
              grep -q "$tok" <<<"$CMDLINE" || { echo "ERROR: cmdline sin $tok" >&2; exit 1; }
            done
          fi
          ! grep -qE 'root=|skip_initramfs' <<<"$CMDLINE"
          ! grep -R -qE '6\.1\.0-sm6125|/lib/modules/6\.1|vermagic.*6\.1' /tmp/boot-validation/native
          SIZE="$(stat -c %s /tmp/boot-out/boot-laurel-v71-native-diag-v2.img)"
          (( SIZE < 67108864 ))
          cp /tmp/config-critical.txt /tmp/boot-validation/config-critical.txt
          cp /tmp/initramfs-file-list.txt /tmp/boot-validation/initramfs-file-list.txt
          cp /tmp/cmdline.txt /tmp/boot-validation/cmdline.txt
          cp /tmp/boot-validation/diagnostic-boot-validation.md /tmp/boot-validation/boot-unpack-report.md
      - name: Checksums y manifest
        run: |
          set -Eeuo pipefail
          cd /tmp/boot-out
          sha256sum boot-laurel-v71-native-diag-v2.img > SHA256SUMS
          jq -n --arg run "${{ github.event.inputs.kernel_artifact_run_id }}" \
            --arg fn "${{ github.event.inputs.usb_function }}" \
            --arg preserve "${{ github.event.inputs.preserve_boot_resources }}" \
            --arg size "$(stat -c %s boot-laurel-v71-native-diag-v2.img)" \
            '{artifact:"boot-laurel-v71-native-diag-v2", kernel_run_id:$run, usb_function:$fn, preserve_boot_resources:($preserve=="true"), size_bytes:($size|tonumber), limit_bytes:67108864, fits:(($size|tonumber)<67108864), root:false, skip_initramfs:false, generated_at:"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > manifest.json
          sha256sum -c SHA256SUMS
          cat SHA256SUMS manifest.json
      - name: Empaquetar salida
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boot-laurel-v71-native-diag-v2
          path: |
            /tmp/boot-out/boot-laurel-v71-native-diag-v2.img
            /tmp/boot-out/SHA256SUMS
            /tmp/boot-out/manifest.json
            /tmp/boot-validation/initramfs-verification.md
            /tmp/boot-validation/initramfs-file-list.txt
            /tmp/boot-validation/config-critical.txt
            /tmp/boot-validation/cmdline.txt
            /tmp/boot-validation/boot-unpack-report.md
          retention-days: 7
      - name: Subir logs de diagnóstico (siempre)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v71-native-diag-v2-logs
          path: |
            /tmp/boot-out/*.log
            /tmp/busybox-out/*.log
            *.log
          retention-days: 3
          if-no-files-found: ignore
