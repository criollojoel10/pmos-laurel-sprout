name: 27-build-kernel-laurel

# Construye SOLO el paquete del kernel para laurel (linux-sm61x5) sobre
# **mainline stable v7.2.11 + el delta downstream del fork sm61x5** (22 parches
# en kupfer-overlay/linux/sm61x5/patches/).
#
# Por qué solo el paquete: en laurel el instalador es el propio Kupfer
# (`update-bootimg`, paquete boot-android-bootimg-updater) y ya soporta A/B:
# escribe en /dev/disk/by-partlabel/boot${androidboot.slot_suffix}. Los hooks
# del paquete (60/90) regeneran el initramfs y reflashean el slot activo, asi
# que NO hace falta reconstruir la rootfs entera.
#
# Artefactos: linux-sm61x5-<ver>-aarch64.pkg.tar.xz (+ headers) y el log.
# Instalacion en laurel (cuando este encendido):
#   sudo pacman -U linux-sm61x5-<ver>-aarch64.pkg.tar.xz
#   (los hooks regeneran initramfs y reflashean el boot; luego reboot)
#
# Basado en 26-build-kupfer.yml (mismo entorno kupferbootstrap) y en
# begonia-kupfer-linux/.github/workflows/build-kernel-71.yml (limpieza de cache).

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Subir artefactos
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kernel-laurel-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    name: Kernel laurel (sm61x5) mainline
    runs-on: ubuntu-24.04
    # El build completo del kernel con cross-gcc tarda ~40 min; margen amplio.
    timeout-minutes: 240
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          df -h | tail -1
          free -h | head -2
          nproc
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Liberar espacio en disco
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h | tail -1
      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git rsync parted libarchive-tools \
            xz-utils zstd device-tree-compiler cpio bc patch
      - name: Clonar kupferbootstrap
        id: kbs
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch dev \
            https://gitlab.com/kupfer/kupferbootstrap.git kupferbootstrap
          git -C kupferbootstrap rev-parse HEAD
          echo "sha=$(git -C kupferbootstrap rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore imagen docker de kupferbootstrap
        id: kbsimg
        # actions/cache/restore@v4.2.2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/kbs-image.tar
          key: kbs-image-${{ steps.kbs.outputs.sha }}
          restore-keys: |
            kbs-image-
      - name: Restore chroots de kupferbootstrap
        # actions/cache/restore@v4.2.2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/kupferbootstrap/chroots
          key: kbs-chroots-${{ steps.kbs.outputs.sha }}
          restore-keys: |
            kbs-chroots-
      - name: Preparar venv de kupferbootstrap
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -q -e .
      - name: Construir la imagen docker de kupferbootstrap
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.kbsimg.outputs.cache-hit }}" = "true" ]; then
            echo "imagen desde cache"
            docker load -i ~/kbs-image.tar
          else
            docker build --pull --network host -t registry.gitlab.com/kupfer/kupferbootstrap:BUILD .
            docker save registry.gitlab.com/kupfer/kupferbootstrap:BUILD -o ~/kbs-image.tar
          fi
          docker run --rm registry.gitlab.com/kupfer/kupferbootstrap:BUILD kupferbootstrap --help >/dev/null
      - name: Preparar cache y config
        id: paths
        run: |
          set -Eeuo pipefail
          CD="$HOME/.cache/kupferbootstrap"
          for d in ccache rust chroots jumpdrive pacman packages pkgbuilds images; do
            mkdir -p "$CD/$d"
          done
          echo "cache_dir=$CD" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.config/kupfer"
          cat > "$HOME/.config/kupfer/kupferbootstrap.toml" <<TOML
          [wrapper]
          type = "docker"

          [build]
          ccache = true
          clean_mode = false
          crosscompile = true
          crossdirect = true
          threads = 0

          [pkgbuilds]
          git_repo = "https://gitlab.com/kupfer/packages/pkgbuilds.git"
          git_branch = "dev"

          [pacman]
          parallel_downloads = 5
          check_space = false

          [paths]
          cache_dir = "$CD"
          chroots = "$CD/chroots"
          jumpdrive = "$CD/jumpdrive"
          pacman = "$CD/pacman"
          packages = "$CD/packages"
          pkgbuilds = "$CD/pkgbuilds"
          images = "$CD/images"
          ccache = "$CD/ccache"
          rust = "$CD/rust"

          [profiles]
          current = "default"

          [profiles.default]
          device = "sm61x5-xiaomi-laurel"
          flavour = "plasma-mobile"
          pkgs_include = [ "rmtfs-git", "qrtr-git", "pd-mapper-git", "tqftpserv-git", "mia3-support" ]
          pkgs_exclude = []
          hostname = "laurel"
          username = "user"

          [ssh]
          username = "user"
          password = "changeme"
          size_extra_mb = 2048
          TOML
      - name: Restore ccache
        # actions/cache/restore@v4.2.2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/kupferbootstrap/ccache
          key: ccache-kernel-laurel-${{ github.sha }}
          restore-keys: |
            ccache-kernel-laurel-
      - name: Restore packages (toolchain de cruce)
        # actions/cache/restore@v4.2.2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/kupferbootstrap/packages
          key: pkgs-kernel-laurel-${{ github.sha }}
          restore-keys: |
            pkgs-kernel-laurel-
      - name: Inicializar pkgbuilds
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          # El wrapper hace `docker run -it`; `script` aporta la pseudotty.
          script -qec ".venv/bin/kupferbootstrap packages init --non-interactive" /dev/null
      - name: Aplicar el overlay del port
        run: |
          set -Eeuo pipefail
          PDIR="$HOME/.cache/kupferbootstrap/pkgbuilds"
          test -d "$PDIR/.git" || { echo "::error::pkgbuilds no clonado"; exit 1; }
          cp -r kupfer-overlay/* "$PDIR"/
          test -f "$PDIR/linux/sm61x5/PKGBUILD" || { echo "::error::falta linux/sm61x5/PKGBUILD"; exit 1; }
          # La serie delta solo existe en las recetas de kernel.org (7.2.6/7.2.11);
          # el tarball del fork (7.2.3) ya trae el delta dentro.
          if [ -d "$PDIR/linux/sm61x5/patches" ]; then
            n=$(ls "$PDIR/linux/sm61x5"/patches/*.patch 2>/dev/null | wc -l)
            echo "parches del delta: $n"
            test "$n" -ge 20 || { echo "::error::faltan los parches del delta ($n)"; exit 1; }
          else
            echo "sin series de parches (tarball del fork con delta incluido)"
          fi
          grep -qE "cdn\.kernel\.org|codeberg\.org/sm61x5-mainline" "$PDIR/linux/sm61x5/PKGBUILD" \
            || { echo "::error::fuente desconocida en el PKGBUILD"; exit 1; }
          grep -qE "^pkgver=7\.2\." "$PDIR/linux/sm61x5/PKGBUILD" \
            || { echo "::error::pkgver inesperada"; exit 1; }
      - name: Construir el toolchain de cruce (x86_64)
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          script -qec ".venv/bin/kupferbootstrap -v packages build --arch x86_64 cross/aarch64-unknown-linux-gnu-bin" /dev/null
          ls -l "$HOME/.cache/kupferbootstrap/packages/x86_64/cross/" | grep -q 'aarch64-unknown-linux-gnu-bin-.*\.pkg\.tar'
      - name: Limpiar paquete del kernel en cache
        # kupferbootstrap se salta el build si encuentra el paquete en su
        # linux.db con checksum intacto (leccion de begonia, run 39160497003).
        run: |
          set -Eeuo pipefail
          PD="$HOME/.cache/kupferbootstrap/packages"
          find "$PD" -name 'linux-sm61x5-*.pkg.tar.*' -delete 2>/dev/null || true
          echo "paquetes linux-sm61x5 tras limpiar: $(find "$PD" -name 'linux-sm61x5-*' 2>/dev/null | wc -l)"
      - name: Build kernel package
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          set -o pipefail   # sin esto el '| tee' se come el fallo
          script -qec ".venv/bin/kupferbootstrap -v packages build --arch aarch64 linux/sm61x5" /dev/null \
            2>&1 | tee kernel-laurel-build.log
          echo "--- log tail ---"; tail -30 kernel-laurel-build.log
      - name: Locate artifacts
        id: art
        run: |
          set -Eeuo pipefail
          PD="$HOME/.cache/kupferbootstrap/packages/aarch64/linux"
          PKG=$(find "$PD" -name 'linux-sm61x5-[0-9]*.pkg.tar.*' ! -name '*headers*' 2>/dev/null | sort | head -1)
          HDR=$(find "$PD" -name 'linux-sm61x5-headers-*.pkg.tar.*' 2>/dev/null | sort | head -1)
          [ -n "$PKG" ] || { echo "::error::no se genero linux-sm61x5"; find "$PD" -type f | head -20; exit 1; }
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "hdr=$HDR" >> "$GITHUB_OUTPUT"
          echo "paquete: $(basename "$PKG") ($(stat -c%s "$PKG") bytes)"
          echo "--- contenido clave ---"
          tar -tJf "$PKG" | grep -E '^boot/(Image.gz|dtbs/qcom/sm6125-xiaomi-laurel-sprout.dtb)$' || true
          echo "DTB: $(tar -tJf "$PKG" | grep -c 'sm6125-xiaomi-laurel-sprout.dtb')"
          echo "modulos ath10k/wcn36xx: $(tar -tJf "$PKG" | grep -cE 'ath10k.*\.ko$|wcn36xx.*\.ko$')"
          echo "panel s6e8fc0: $(tar -tJf "$PKG" | grep -c 'panel-samsung-s6e8fc0')"
          echo "version del kernel: $(tar -xOJf "$PKG" usr/lib/modules/*/extramodules/version 2>/dev/null || tar -tJf "$PKG" | grep -m1 'usr/lib/modules/')"
      - name: Upload artifacts
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-laurel-7211-${{ github.run_number }}
          path: |
            ${{ steps.art.outputs.pkg }}
            ${{ steps.art.outputs.hdr }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-laurel-build-log-${{ github.run_number }}
          path: kupferbootstrap/kernel-laurel-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save ccache (siempre)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/kupferbootstrap/ccache
          key: ccache-kernel-laurel-${{ github.sha }}
