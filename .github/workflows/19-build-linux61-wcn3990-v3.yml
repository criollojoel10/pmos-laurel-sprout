name: 19-build-linux61-wcn3990-v3

# Variante WCN3990 v3 CI-READY: remoteproc_mpss HABILITADO (status = "okay")
# sobre el fork fijado 77de535b. Extiende la cadena validada de workflow 18
# (v2, MPSS disabled) aplicando ademas 0003 (board override &remoteproc_mpss
# status = "okay") y validando toda la cadena en modo v3.
#
# ADVERTENCIA: el MPSS queda ENABLED en el DTB pero el firmware del modem NO
# esta en el rootfs ni el userspace esta integrado. Este artefacto NO debe
# bootearse hasta que firmware privado + userspace esten instalados y haya
# autorizacion explicita (FASE 8). Solo valida DTB/empaquetado.
#
# Reutiliza kernel/ramdisk del artefacto historico, reconstruye SOLO el DTB
# del fork fijado y ensambla boot v0 con el DTB nuevo. NO flashea, NO usa adb,
# NO escribe el telefono, NO sube firmware ni rootfs.
#
# Disparo manual obligatorio (workflow_dispatch). Sin push/pull_request/schedule.

on:
  workflow_dispatch:
    inputs:
      rootfs_run_id:
        description: Run ID del artefacto historical-rootfs-ssh
        required: true
        default: "31760183247"
      upload_artifacts:
        description: Subir artefactos de validación
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: linux61-wcn3990-v3
  cancel-in-progress: true

jobs:
  build:
    name: WCN3990 v3 DTB+boot (MPSS enabled, firmware absent)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          df -h
          free -h
          uname -a

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Dependencias
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler flex bison bc libssl-dev libelf-dev python3 gzip cpio file jq

      - name: Descargar boot/rootfs fuente (historico)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: historical-rootfs-ssh
          path: /tmp/historical-rootfs-ssh
          run-id: ${{ github.event.inputs.rootfs_run_id }}
          github-token: ${{ github.token }}

      - name: Verificar fuente y extraer kernel/ramdisk
        run: |
          set -Eeuo pipefail
          BOOT=$(find /tmp/historical-rootfs-ssh -type f -name boot.img -print -quit)
          MANIFEST=$(find /tmp/historical-rootfs-ssh -type f -name manifest.json -print -quit)
          test -n "$BOOT" && test -n "$MANIFEST"
          test "$(jq -r .kernel "$MANIFEST")" = "linux-postmarketos-qcom-sm6125 6.1 @77de535b8dbd8f483b5802c8937cb714bab5b485"
          mkdir -p /tmp/source-out /tmp/boot-out
          python3 - "$BOOT" <<'PY'
          import struct, sys
          from pathlib import Path
          boot = Path(sys.argv[1]).read_bytes()
          ksz, _, rsz, _, _, _, _, page, version, _ = struct.unpack_from('<10I', boot, 8)
          if version != 0 or page != 4096:
              raise SystemExit('ERROR: no es boot v0/page4096')
          kernel = boot[page:page + ksz]
          roff = page + ((ksz + page - 1) // page) * page
          ramdisk = boot[roff:roff + rsz]
          Path('/tmp/source-out/kernel-source-with-historical-dtb').write_bytes(kernel)
          Path('/tmp/source-out/ramdisk').write_bytes(ramdisk)
          print('region kernel historica (Image.gz + DTB viejo):', len(kernel), 'bytes')
          print('ramdisk:', len(ramdisk), 'bytes')
          PY
          # Separacion estructural: Image.gz puro + DTB historico (solo evidencia).
          # El script valida FDT magic 0xd00dfeed y totalsize big-endian, exige
          # que la frontera del DTB termine exactamente al final del payload y
          # rechaza gzip vacio/corrupto, DTB truncado y doble DTB.
          python3 scripts/split-appended-dtb.py \
            --input /tmp/source-out/kernel-source-with-historical-dtb \
            --kernel-out /tmp/source-out/kernel.gz \
            --dtb-out /tmp/source-out/historical-source.dtb \
            --report /tmp/source-out/split-report.json
          # gzip -t SOLO sobre el Image.gz puro (nunca sobre payload con DTB)
          gzip -t /tmp/source-out/kernel.gz
          cp /tmp/source-out/kernel.gz /tmp/kernel.gz
          cp /tmp/source-out/ramdisk /tmp/ramdisk
          echo "== split-report.json =="
          cat /tmp/source-out/split-report.json
          stat -c '%n %s bytes' /tmp/source-out/kernel-source-with-historical-dtb /tmp/source-out/kernel.gz /tmp/source-out/historical-source.dtb /tmp/source-out/ramdisk

      - name: Clonar kernel 6.1 fijado
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout https://gitlab.com/sm6125-mainline/linux.git kernel61
          git -C kernel61 fetch --depth 1 origin 77de535b8dbd8f483b5802c8937cb714bab5b485
          git -C kernel61 checkout -q 77de535b8dbd8f483b5802c8937cb714bab5b485
          git -C kernel61 rev-parse HEAD > /tmp/kernel-commit.txt
          cat /tmp/kernel-commit.txt

      - name: Aplicar parches 0001, 0002 y 0003 en orden estricto
        run: |
          set -Eeuo pipefail
          P1="$GITHUB_WORKSPACE/patches/kernel-61/0001-dts-laurel-wcn3990-first-probe.patch"
          P2="$GITHUB_WORKSPACE/patches/kernel-61/0002-dts-sm6125-add-mpss-transport-v2.patch"
          P3="$GITHUB_WORKSPACE/patches/kernel-61/0003-dts-laurel-enable-mpss.patch"
          test -f "$P1" && test -f "$P2" && test -f "$P3"
          # 0003 es el enable de placa: verificar que contenga el override unico
          # antes de aplicarlo (gate de fuente v3). Contar SOLO lineas ANNADIDAS
          # (prefijo '+' del diff): el patch de git no tiene el override en
          # lineas de contexto/commit, asi que el gate anterior (sin '+')
          # contaba 0 en lugar de 1 y abortaba falsamente.
          P3_OVERRIDE_COUNT=$(grep -Ec '^\+[[:space:]]*&remoteproc_mpss[[:space:]]*\{' "$P3" || true)
          P3_OKAY_COUNT=$(grep -Ec '^\+[[:space:]]*status[[:space:]]*=[[:space:]]*"okay";' "$P3" || true)
          printf 'P3_OVERRIDE_COUNT=%s\n' "$P3_OVERRIDE_COUNT"
          printf 'P3_OKAY_COUNT=%s\n' "$P3_OKAY_COUNT"
          test "$P3_OVERRIDE_COUNT" -eq 1
          test "$P3_OKAY_COUNT" -eq 1
          git -C kernel61 apply --check "$P1"
          git -C kernel61 apply "$P1"
          git -C kernel61 apply --check "$P2"
          git -C kernel61 apply "$P2"
          git -C kernel61 apply --check "$P3"
          git -C kernel61 apply "$P3"
          # 0003 aplicado una sola vez: si se reaplicara, git apply fallaria.
          # Confirmacion explicita de override unico en el board resultante.
          BOARD=kernel61/arch/arm64/boot/dts/qcom/sm6125-xiaomi-laurel_sprout.dts
          BOARD_OVERRIDE_COUNT=$(grep -Ec '^[[:space:]]*&remoteproc_mpss[[:space:]]*\{' "$BOARD" || true)
          printf 'BOARD_OVERRIDE_COUNT=%s\n' "$BOARD_OVERRIDE_COUNT"
          test "$BOARD_OVERRIDE_COUNT" -eq 1
          { echo "== git diff --stat =="; git -C kernel61 diff --stat; echo "== git diff --check =="; git -C kernel61 diff --check; } | tee /tmp/apply-diff.log

      - name: Verificar fuentes tras parches (v3, MPSS okay)
        run: |
          set -Eeuo pipefail
          bash scripts/verify-wcn3990-mpss-v2.sh --tree kernel61 --expect-mpss okay --out /tmp/source-verify
          cat /tmp/source-verify/mpss-v2-verification.md

      - name: Construir DTB (procedimiento historico)
        run: |
          set -Eeuo pipefail
          make -C kernel61 ARCH=arm64 defconfig >/tmp/dtb-defconfig.log 2>&1
          make -C kernel61 ARCH=arm64 dtbs -j"$(nproc)" >/tmp/dtb-build.log 2>&1
          DTB=$(find kernel61/arch/arm64/boot/dts -name sm6125-xiaomi-laurel_sprout.dtb -print -quit)
          test -n "$DTB"
          cp "$DTB" /tmp/new-v3.dtb
          sha256sum /tmp/new-v3.dtb

      - name: Ensamblar boot v0 Wi-Fi v3 (historico)
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/boot-out
          python3 scripts/build-boot-image.py \
            --kernel /tmp/kernel.gz \
            --ramdisk /tmp/ramdisk \
            --dtb /tmp/new-v3.dtb \
            --out /tmp/boot-out/boot-linux61-wcn3990-v3.img \
            --header-version 0 --append-dtb --base 0x0 --page-size 4096 \
            --kernel-offset 0x8000 --ramdisk-offset 0x1000000 --tags-offset 0x100 \
            --cmdline 'clk_ignore_unused consoleblank=0' \
            --os-version 1.0.0 --os-patch-level 2026-08

      - name: Extraer boot final y validar payload (gates 12)
        run: |
          set -Eeuo pipefail
          BOOT=/tmp/boot-out/boot-linux61-wcn3990-v3.img
          python3 - "$BOOT" <<'PY'
          import hashlib, struct, sys
          boot = open(sys.argv[1], 'rb').read()
          if boot[:8] != b'ANDROID!': raise SystemExit('bad magic')
          kernel_size, _, ramdisk_size, _, _, _, _, page, version, _ = struct.unpack_from('<10I', boot, 8)
          if version != 0 or page != 4096: raise SystemExit('expected boot v0/page4096')
          # ---- cmdline exacto ----
          cmdline = boot[64:576].split(b'\0', 1)[0].decode('ascii', 'replace')
          expected_cmdline = 'clk_ignore_unused consoleblank=0'
          if cmdline != expected_cmdline:
              raise SystemExit(f'ERROR: cmdline inesperado [{cmdline!r}] (esperado [{expected_cmdline!r}])')
          # ---- tamanio maximo ----
          if len(boot) > 0x4000000: raise SystemExit('boot.img > 64 MiB')
          # ---- payload kernel completo (Image.gz + DTB v3) ----
          kernel = boot[page:page + kernel_size]
          open('/tmp/boot-out/kernel-with-v3-dtb', 'wb').write(kernel)
          open('/tmp/boot-out/ramdisk', 'wb').write(boot[page + ((kernel_size + page - 1) // page) * page : page + ((kernel_size + page - 1) // page) * page + ramdisk_size])
          open('/tmp/validated-cmdline.txt', 'w').write(cmdline)
          print('cmdline OK:', cmdline)
          print('boot_sha256=', hashlib.sha256(boot).hexdigest())
          print('kernel+dtb', len(kernel))
          PY
          # Verificacion estructural del payload final: DEBE ser Image.gz puro +
          # DTB v3 unico. El script rechaza payload que no termine en un unico
          # DTB (por tanto falla con doble DTB o DTB historico reutilizado).
          python3 scripts/split-appended-dtb.py \
            --input /tmp/boot-out/kernel-with-v3-dtb \
            --kernel-out /tmp/boot-out/kernel.gz \
            --dtb-out /tmp/boot-out/final-v3.dtb \
            --report /tmp/boot-out/split-report-final.json
          # gzip -t SOLO sobre el Image.gz puro extraido del boot final
          gzip -t /tmp/boot-out/kernel.gz
          echo "gzip -t kernel.gz OK (payload final sin DTB)"
          # DTB final debe ser byte-identico al DTB v3 construido (no historico)
          cmp /tmp/boot-out/final-v3.dtb /tmp/new-v3.dtb
          echo "final-v3.dtb == new-v3.dtb (byte-identico)"
          # el kernel.gz puro del boot final debe coincidir con el fuente puro
          cmp /tmp/boot-out/kernel.gz /tmp/source-out/kernel.gz
          echo "kernel.gz del boot final == kernel.gz fuente (byte-identico)"
          test -s /tmp/boot-out/kernel.gz
          test -s /tmp/boot-out/ramdisk
          test -s /tmp/boot-out/final-v3.dtb
          test -s /tmp/boot-out/kernel-with-v3-dtb
          stat -c '%n %s bytes' "$BOOT" /tmp/boot-out/kernel-with-v3-dtb /tmp/boot-out/kernel.gz /tmp/boot-out/ramdisk /tmp/boot-out/final-v3.dtb

      - name: Decompilar DTB final y verificar (v3, MPSS okay)
        run: |
          set -Eeuo pipefail
          dtc -I dtb -O dts -o /tmp/boot-out/final-v3.dts /tmp/boot-out/final-v3.dtb 2>/tmp/final-dtc.log
          # validacion semantica del DTB final decompilado (phandle-aware)
          python3 scripts/validate-mpss-v2-final.py --dts /tmp/boot-out/final-v3.dts --expect-mpss okay
          # wrapper completo sobre el final-dts (mismos gates)
          bash scripts/verify-wcn3990-mpss-v2.sh --final-dts /tmp/boot-out/final-v3.dts --expect-mpss okay --out /tmp/final-verify
          cat /tmp/final-verify/mpss-v2-verification.md

      - name: Generar SHA256SUMS y manifiesto v3
        run: |
          set -Eeuo pipefail
          # evidencias del split en el artefacto: kernel fuente con DTB historico,
          # Image.gz puro, DTB historico y split-report de la fuente
          cp /tmp/source-out/kernel-source-with-historical-dtb /tmp/boot-out/
          cp /tmp/source-out/historical-source.dtb /tmp/boot-out/
          cp /tmp/source-out/split-report.json /tmp/boot-out/
          # reportes de validacion de fuente y final en el artefacto
          cp /tmp/source-verify/mpss-v2-verification.md /tmp/boot-out/source-validation.md
          cp /tmp/final-verify/mpss-v2-verification.md /tmp/boot-out/final-validation.md
          (cd /tmp/boot-out && sha256sum -- * > SHA256SUMS)
          KERNSRC=$(sha256sum /tmp/boot-out/kernel-source-with-historical-dtb | cut -d' ' -f1)
          KERGZ=$(sha256sum /tmp/boot-out/kernel.gz | cut -d' ' -f1)
          DTBSRC=$(sha256sum /tmp/boot-out/historical-source.dtb | cut -d' ' -f1)
          DTBFINAL=$(sha256sum /tmp/boot-out/final-v3.dtb | cut -d' ' -f1)
          BOOTSHA=$(sha256sum /tmp/boot-out/boot-linux61-wcn3990-v3.img | cut -d' ' -f1)
          jq -n --arg run "${{ github.event.inputs.rootfs_run_id }}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg kcommit "$(cat /tmp/kernel-commit.txt)" \
            --arg cmdline "$(cat /tmp/validated-cmdline.txt)" \
            --arg ksrc "$KERNSRC" --arg kgz "$KERGZ" \
            --arg dsrc "$DTBSRC" --arg dfinal "$DTBFINAL" --arg bsha "$BOOTSHA" \
            '{artifact:"boot-linux61-wcn3990-v3", source_rootfs_run:$run,
              kernel_commit:$kcommit,
              patches:["0001-dts-laurel-wcn3990-first-probe","0002-dts-sm6125-add-mpss-transport-v2","0003-dts-laurel-enable-mpss"],
              cmdline:$cmdline,
              sha256:{boot:$bsha, kernel_source_with_historical_dtb:$ksrc,
                      kernel_gz:$kgz, historical_source_dtb:$dsrc, final_v3_dtb:$dfinal},
              mpss_status:"okay", boot_enabled:true,
              firmware_in_rootfs:false, userspace_mpss_ready:false,
              physical_status:"boot-untested", status:"configured-ci-ready",
              risk:"MPSS enabled without firmware; do not boot until private firmware and userspace are installed",
              generated_at:$date}' > /tmp/boot-out/manifest.json
          cat /tmp/boot-out/SHA256SUMS
          cat /tmp/boot-out/manifest.json

      - name: Gates de manifiesto v3 (bloqueantes)
        run: |
          set -Eeuo pipefail
          M=/tmp/boot-out/manifest.json
          jq -e '.firmware_in_rootfs == false' "$M" >/dev/null \
            || { echo "FALLO: firmware_in_rootfs debe ser false" >&2; exit 1; }
          jq -e '.userspace_mpss_ready == false' "$M" >/dev/null \
            || { echo "FALLO: userspace_mpss_ready debe ser false" >&2; exit 1; }
          jq -e '.mpss_status == "okay"' "$M" >/dev/null \
            || { echo "FALLO: mpss_status debe ser okay" >&2; exit 1; }
          jq -e '.physical_status == "boot-untested"' "$M" >/dev/null \
            || { echo "FALLO: physical_status debe ser boot-untested" >&2; exit 1; }
          jq -e '.boot_enabled == true' "$M" >/dev/null \
            || { echo "FALLO: boot_enabled debe ser true" >&2; exit 1; }
          echo "Gates de manifiesto v3 OK"

      - name: Subir artefacto WCN3990 v3
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boot-linux61-wcn3990-v3
          path: /tmp/boot-out/
          retention-days: 7

      - name: Subir logs siempre
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux61-wcn3990-v3-logs
          path: |
            /tmp/*.log
            /tmp/source-verify/mpss-v2-verification.md
            /tmp/final-verify/mpss-v2-verification.md
          retention-days: 3
          if-no-files-found: ignore