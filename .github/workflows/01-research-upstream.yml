name: 01-research-upstream

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-upstream
  cancel-in-progress: true

jobs:
  research:
    name: Auditoría de fuentes upstream
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"
          echo "::group::uname -a"; uname -a; echo "::endgroup::"
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Ejecutar investigación upstream
        run: |
          set -Eeuo pipefail
          bash scripts/research-upstream.sh --tmp /tmp/research-upstream --out reports
          echo "::group::source-audit.md"
          cat reports/source-audit.md
          echo "::endgroup::"
      - name: Subir informes
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-reports
          path: |
            reports/source-audit.md
            reports/source-candidates.json
            reports/patch-audit.md
            reports/device-comparison.md
            reports/firmware-audit.md
            reports/boot-image-layout.md
            reports/hypothesis-registry.json
            reports/hardware-matrix.json
          retention-days: 7
      - name: Subir logs de diagnóstico (siempre)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-diagnostic
          path: |
            *.log
            **/*.log
          retention-days: 3
          if-no-files-found: ignore
