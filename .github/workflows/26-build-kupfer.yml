name: 26-build-kupfer

# Construye Kupfer Linux (Arch ARM) para el Xiaomi Mi A3 (SM6125 / laurel_sprout)
# con kupferbootstrap, siguiendo el recetario probado del port de begonia
# (criollojoel10/begonia-kupfer-linux). Todo el trabajo pesado ocurre en GitHub
# Actions; en local solo se edita el repo (AGENTS.md §3/§4).
#
# Produce artefactos en el mismo formato que el build de pmOS, para que
# docs/FLASH-LAUREL-CACHYOS.md sirva igual:
#   boot.img (particion boot_b), rootfs.img (userdata), vbmeta.img, SHA256SUMS.

on:
  workflow_dispatch:
    inputs:
      flavour:
        description: 'Flavour (plasma-mobile, phosh, ...)'
        type: string
        default: 'plasma-mobile'
      size_extra_mb:
        description: 'MB extra para la rootfs'
        type: string
        default: '2048'
      upload_artifacts:
        description: Subir artefactos
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kupfer-laurel-${{ github.ref }}
  cancel-in-progress: true

env:
  # kupferbootstrap usa sintaxis de BuildKit en su Dockerfile.
  DOCKER_BUILDKIT: "1"
  ROM_URL: "https://cdnorg.d.miui.com/V12.0.26.0.RFQMIXM/laurel_sprout_global_images_V12.0.26.0.RFQMIXM_20220808.0000.00_11.0_2292e2c0b1.tgz"
  ROM_MD5_PREFIX: "2292e2c0b1"

jobs:
  build:
    name: Kupfer Linux (laurel_sprout)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"
          echo "::group::uname -a"; uname -a; echo "::endgroup::"
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Liberar espacio en disco
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h
      - name: Instalar dependencias
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git rsync parted libarchive-tools \
            aria2 xz-utils device-tree-compiler e2fsprogs
      - name: Clonar kupferbootstrap
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch dev \
            https://gitlab.com/kupfer/kupferbootstrap.git kupferbootstrap
          git -C kupferbootstrap rev-parse HEAD
      - name: Preparar venv de kupferbootstrap
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -q -e .
      - name: Construir la imagen docker de kupferbootstrap
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          docker build --pull --network host -t registry.gitlab.com/kupfer/kupferbootstrap:BUILD .
          docker run --rm registry.gitlab.com/kupfer/kupferbootstrap:BUILD kupferbootstrap --help >/dev/null
      - name: Preparar cache y config
        id: paths
        run: |
          set -Eeuo pipefail
          CD="$HOME/.cache/kupferbootstrap"
          for d in ccache rust chroots jumpdrive pacman packages pkgbuilds images; do
            mkdir -p "$CD/$d"
          done
          echo "cache_dir=$CD" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.config/kupfer"
          cat > "$HOME/.config/kupfer/kupferbootstrap.toml" <<TOML
          [wrapper]
          type = "docker"

          [build]
          ccache = true
          clean_mode = false
          crosscompile = true
          crossdirect = true
          threads = 0

          [pkgbuilds]
          git_repo = "https://gitlab.com/kupfer/packages/pkgbuilds.git"
          git_branch = "dev"

          [pacman]
          parallel_downloads = 5
          check_space = false

          [paths]
          cache_dir = "$CD"
          chroots = "$CD/chroots"
          jumpdrive = "$CD/jumpdrive"
          pacman = "$CD/pacman"
          packages = "$CD/packages"
          pkgbuilds = "$CD/pkgbuilds"
          images = "$CD/images"
          ccache = "$CD/ccache"
          rust = "$CD/rust"

          [profiles]
          current = "default"

          [profiles.default]
          device = "sm61x5-xiaomi-laurel"
          flavour = "${{ github.event.inputs.flavour || 'plasma-mobile' }}"
          pkgs_include = []
          pkgs_exclude = []
          hostname = "laurel"
          username = "user"
          password = "changeme"
          size_extra_mb = ${{ github.event.inputs.size_extra_mb || 2048 }}
          TOML
          echo "--- kupferbootstrap.toml ---"
          cat "$HOME/.config/kupfer/kupferbootstrap.toml"
      - name: Inicializar pkgbuilds
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          # El wrapper hace `docker run -it`; sin TTY real docker aborta con
          # "the input device is not a TTY". `script` aporta una pseudotty.
          script -qec ".venv/bin/kupferbootstrap packages init --non-interactive" /dev/null
      - name: Aplicar el overlay del port
        run: |
          set -Eeuo pipefail
          PDIR="$HOME/.cache/kupferbootstrap/pkgbuilds"
          test -d "$PDIR/.git" || { echo "::error::pkgbuilds no clonado en $PDIR"; exit 1; }
          cp -r kupfer-overlay/* "$PDIR"/
          for f in linux/sm61x5/PKGBUILD \
                   device/device-sm61x5-xiaomi-laurel/PKGBUILD \
                   device/device-sm61x5-xiaomi-laurel/xiaomi-laurel.conf \
                   firmware/sm61x5-xiaomi-laurel/PKGBUILD; do
            test -f "$PDIR/$f" || { echo "::error::overlay ausente: $f"; exit 1; }
            echo "overlay ok: $f"
          done
      - name: Descargar el ROM oficial (firmware)
        env:
          C: ${{ runner.temp }}/fwext
        run: |
          set -Eeuo pipefail
          mkdir -p "$C"
          if [ -s "$C/fw.tar" ]; then echo "fw.tar en cache"; exit 0; fi
          if [ ! -s "$C/rom.tgz" ]; then
            aria2c -c -x 16 -s 16 -k 1M --file-allocation=none -d "$C" -o rom.tgz "$ROM_URL"
          fi
          got=$(md5sum < "$C/rom.tgz" | cut -c1-10)
          [ "$got" = "$ROM_MD5_PREFIX" ] || { echo "::error::md5 del ROM no coincide ($got)"; exit 1; }
      - name: Extraer el firmware
        env:
          C: ${{ runner.temp }}/fwext
        run: |
          set -Eeuo pipefail
          # Se usa una imagen minima (Alpine + android-tools + pil-squasher +
          # python3) con el extractor oficial. El extractor monta las
          # particiones stock en solo-lectura, de ahi --privileged.
          docker build -q -t pmos-fw kupfer-overlay/firmware/ >/dev/null
          docker run --privileged --rm \
            -v "$C:/w" \
            -v "$GITHUB_WORKSPACE/pmaports-overlay/firmware:/ext:ro" \
            pmos-fw \
            sh -ec '
              set -e
              cd /w
              mkdir -p rom fwout
              tar -xzf rom.tgz -C rom --strip-components=2 --wildcards "*/images/NON-HLOS.bin" "*/images/BTFM.bin" "*/images/vendor.img"
              mv rom/NON-HLOS.bin rom/modem_a
              mv rom/BTFM.bin rom/bluetooth_a
              simg2img rom/vendor.img rom/vendor_a
              rm -f rom/vendor.img
              L=/w/rom FW=/w/fwout/fw sh /ext/extract-firmware.sh
              tar -C /w/fwout -cf /w/fw.tar fw
              rm -rf /w/rom /w/fwout /w/rom.tgz
            '
          CD="$HOME/.cache/kupferbootstrap/pkgbuilds/firmware/sm61x5-xiaomi-laurel"
          cp "$C/fw.tar" "$CD/fw.tar"
          tar -tf "$C/fw.tar" | head -5
          echo "fw.tar: $(du -h "$C/fw.tar" | cut -f1)"
      - name: Comprobar los PKGBUILD
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          script -qec ".venv/bin/kupferbootstrap packages check --ci-mode \
            linux-sm61x5 device-sm61x5-xiaomi-laurel firmware-sm61x5-xiaomi-laurel" /dev/null
      - name: Construir el toolchain de cruce (x86_64)
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          script -qec ".venv/bin/kupferbootstrap -v packages build --arch x86_64 cross/aarch64-unknown-linux-gnu-bin" /dev/null
          ls -l "$HOME/.cache/kupferbootstrap/packages/x86_64/cross/" \
            | grep -q 'aarch64-unknown-linux-gnu-bin-.*\.pkg\.tar' \
            || { echo "::error::el toolchain aarch64 no esta en el repo local"; exit 1; }
      - name: Generar clave SSH (evita un prompt que bloquea)
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          [ -f ~/.ssh/id_ed25519_kupfer ] || \
            ssh-keygen -t ed25519 -N '' -C 'kupfer-laurel-build' -f ~/.ssh/id_ed25519_kupfer
      - name: Construir la imagen
        working-directory: kupferbootstrap
        run: |
          set -Eeuo pipefail
          set -o pipefail
          script -qec ".venv/bin/kupferbootstrap -v image build --sector-size 4096" /dev/null 2>&1 \
            | tee "$RUNNER_TEMP/kupfer-image.log"
          test -s "$RUNNER_TEMP/kupfer-image.log"
          grep -aq 'Initcpio image generation successful' "$RUNNER_TEMP/kupfer-image.log" || {
            echo "::error::el initramfs de la rootfs no se genero bien"; exit 1; }
          grep -aq 'Generating new aboot.img' "$RUNNER_TEMP/kupfer-image.log" || {
            echo "::error::aboot.img no se ha generado"; exit 1; }
      - name: Extraer artefactos flasheables
        run: |
          set -Eeuo pipefail
          IMGDIR="$HOME/.cache/kupferbootstrap/images"
          IMG=$(ls -1 "$IMGDIR"/*-full.img 2>/dev/null | head -1)
          [ -n "$IMG" ] || { echo "::error::no se encuentra la imagen full"; exit 1; }
          OUT="$RUNNER_TEMP/kupfer-out"
          mkdir -p "$OUT"
          # La tabla msdos se creo sobre un loop con -b 4096; hay que leerla igual.
          LOOP=$(sudo losetup -f --show -b 4096 -P "$IMG")
          sudo partprobe "$LOOP" || true
          for i in $(seq 1 30); do [ -e "${LOOP}p1" ] && break; sleep 0.5; done
          MNT=/tmp/kupfer-boot
          sudo mkdir -p "$MNT"
          sudo mount -o ro "${LOOP}p1" "$MNT" || sudo mount -o ro,noload "${LOOP}p1" "$MNT"
          sudo cp "$MNT/aboot.img" "$OUT/boot.img"
          sudo umount "$MNT"
          # La rootfs es la segunda particion; se vuelca tal cual para que el
          # usuario la escriba en la particion userdata desde fastboot.
          sudo dd if="${LOOP}p2" of="$OUT/rootfs.img" bs=4M status=none
          sudo losetup -d "$LOOP"
          sudo chown "$(id -u):$(id -g)" "$OUT/boot.img" "$OUT/rootfs.img"
          chmod 0644 "$OUT/boot.img" "$OUT/rootfs.img"
          if command -v avbtool >/dev/null 2>&1; then
            avbtool make_vbmeta_image --flags 2 --padding_size 4096 --output "$OUT/vbmeta.img"
          else
            python3 -c "print('avbtool no disponible en el runner')"
          fi
          ls -la "$OUT"
      - name: Validar artefactos
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/kupfer-out"
          ok=0
          for f in boot.img rootfs.img; do
            [ -s "$OUT/$f" ] || { echo "::error::falta $OUT/$f"; ok=1; }
          done
          [ "$ok" = 0 ] || exit 1
          # El boot.img debe tener la firma ANDROID! de un boot image.
          head -c 8 "$OUT/boot.img" | grep -aq 'ANDROID!' \
            || { echo "::error::boot.img no empieza con ANDROID! (no es un boot image)"; exit 1; }
          LC_ALL=C grep -qa -m1 -E 'kupfer|arch|baselayout' "$OUT/rootfs.img" \
            || { echo "::error::rootfs.img no parece contener una rootfs"; exit 1; }
          ( cd "$OUT" && sha256sum boot.img rootfs.img > SHA256SUMS 2>/dev/null || true )
          [ -f "$OUT/vbmeta.img" ] && ( cd "$OUT" && sha256sum vbmeta.img >> SHA256SUMS )
          cat "$OUT/SHA256SUMS"
      - name: Subir artefactos (si aplica)
        if: ${{ github.event.inputs.upload_artifacts == 'true' }}
        # actions/upload-artifact@v5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kupfer-laurel-${{ github.event.inputs.flavour || 'plasma-mobile' }}
          path: ${{ runner.temp }}/kupfer-out/
          retention-days: 7
          if-no-files-found: error
      - name: Subir logs de diagnóstico (siempre)
        if: always()
        # actions/upload-artifact@v5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kupfer-laurel-diagnostic
          path: |
            ${{ runner.temp }}/kupfer-image.log
            ${{ runner.temp }}/fwext/*.log
          retention-days: 3
          if-no-files-found: ignore
