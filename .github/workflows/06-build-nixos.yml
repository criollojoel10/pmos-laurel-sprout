name: Build NixOS

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'console, gnome or kde'
        required: false
        default: 'console'
        type: choice
        options: [console, gnome, kde]
  workflow_call:
    inputs:
      build_variant:
        description: 'console or phosh'
        required: false
        type: string
        default: 'console'
    secrets:
      GH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: nixos-${{ inputs.build_variant || 'console' }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: "Shared kernel (debug)"
    uses: ./.github/workflows/reusable-build-kernel.yml
    with:
      build_variant: debug
      upload_artifacts: true

  build-nixos:
    name: "NixOS (${{ inputs.build_variant || 'console' }})"
    needs: build-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUILD_VARIANT: ${{ inputs.build_variant || 'console' }}
    steps:
      - name: Runner info
        run: |
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"

      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download kernel artifacts
        # actions/download-artifact@v4.3.3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-debug
          path: /tmp/kernel-artifact

      # DeterminateSystems/nix-installer-action@v16
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d
        with:
          daemon: true
          extra-conf: |
            experimental-features = nix-command flakes
            # Permitir al nix-daemon construir derivaciones aarch64-linux
            # en el runner x86_64 mediante binfmt/qemu.
            extra-platforms = aarch64-linux

      - name: Verify committed flake.lock (never auto-generated)
        run: |
          set -Eeuo pipefail
          test -f nixos/flake.lock || {
            echo "FALLO: falta nixos/flake.lock versionado" >&2; exit 1; }
          echo "flake.lock presente: $(jq -r '.nodes.nixpkgs.locked.rev' nixos/flake.lock)"

      - name: Enable cross-compilation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support crossbuild-essential-arm64
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Build NixOS rootfs (fail-closed)
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build-nixos-rootfs.sh
          scripts/build-nixos-rootfs.sh \
            --kernel-artifact /tmp/kernel-artifact \
            --variant "$BUILD_VARIANT" \
            --out /tmp/output

      - name: Upload NixOS artifacts
        # actions/upload-artifact@v4.9.5
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-${{ inputs.build_variant || 'console' }}
          path: |
            /tmp/output/nixos/*
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: failure()
        # actions/upload-artifact@v4.9.5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-diagnostic-log
          path: /tmp/nix-*.log
          retention-days: 3
          if-no-files-found: ignore