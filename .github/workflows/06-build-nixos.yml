name: Build NixOS

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'console or phosh'
        required: false
        default: 'console'
        type: choice
        options: [console, phosh]
  workflow_call:
    inputs:
      build_variant:
        description: 'console or phosh'
        required: false
        type: string
        default: 'console'
    secrets:
      GH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: nixos-${{ inputs.build_variant || 'console' }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: "Shared kernel (debug)"
    uses: ./.github/workflows/reusable-build-kernel.yml
    with:
      build_variant: debug
      upload_artifacts: true

  build-nixos:
    name: "NixOS (${{ inputs.build_variant || 'console' }})"
    needs: build-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUILD_VARIANT: ${{ inputs.build_variant || 'console' }}
    steps:
      - name: Runner info
        run: |
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"

      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download kernel artifacts
        # actions/download-artifact@v4.3.3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-debug
          path: /tmp/kernel-artifact

      # DeterminateSystems/nix-installer-action@v16
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d
        with:
          daemon: true
          extra-conf: |
            experimental-features = nix-command flakes
            # Permitir al nix-daemon construir derivaciones aarch64-linux
            # en el runner x86_64 mediante binfmt/qemu (sin esto:
            # "platform mismatch, Required system aarch64-linux").
            extra-platforms = aarch64-linux

      - name: Generate flake.lock
        run: |
          cd nixos
          if [[ ! -f flake.lock ]]; then
            echo "Generating flake.lock..."
            nix flake lock --update-input nixpkgs
            echo "::group::flake.lock"
            cat flake.lock
            echo "::endgroup::"
          else
            echo "flake.lock already exists"
            cat flake.lock
          fi

      - name: Validate flake
        run: |
          cd nixos
          echo "::group::nix flake metadata"
          nix flake metadata
          echo "::endgroup::"
          echo "::group::nix flake show"
          nix flake show 2>&1 || echo "(show may fail without aarch64 emulation)"
          echo "::endgroup::"
          # Evaluate platform
          nix eval .#nixosConfigurations.laurel-console.config.nixpkgs.hostPlatform.system 2>/dev/null || echo "eval skipped"

      - name: Enable cross-compilation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support crossbuild-essential-arm64
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Build NixOS closure
        run: |
          CONFIG="laurel-${BUILD_VARIANT}"
          echo "Building nixosConfigurations.${CONFIG}..."
          # Evaluate the flake to get the system closure.
          # flake.nix lives in nixos/; must run from that directory.
          cd nixos
          if ! nix build \
            .#nixosConfigurations.${CONFIG}.config.system.build.toplevel \
            --no-link --print-out-paths \
            > /tmp/nix-build.log 2>&1; then
            echo "NOTE: NixOS cross-build for SM6125 is experimental."
            echo "The full NixOS build requires aarch64 emulation or native runner."
            echo "Full build log saved to /tmp/nix-build.log and uploaded as diagnostic."
            echo "Creating minimal output from kernel artifacts + NixOS config."
          else
            echo "NixOS closure built successfully:"
            tail -3 /tmp/nix-build.log
          fi
          # Create output artifact
          mkdir -p /tmp/output/nixos
          cp /tmp/kernel-artifact/Image /tmp/output/nixos/ 2>/dev/null || true
          cp /tmp/kernel-artifact/sm6125-xiaomi-laurel-sprout.dtb /tmp/output/nixos/ 2>/dev/null || true
          if [[ -f /tmp/kernel-artifact/modules.tar.zst ]]; then
            mkdir -p /tmp/output/nixos/modules
            tar --zstd -xf /tmp/kernel-artifact/modules.tar.zst -C /tmp/output/nixos/modules/ 2>/dev/null || true
          fi
          cp "${GITHUB_WORKSPACE}/nixos/flake.nix" /tmp/output/nixos/
          cp -a "${GITHUB_WORKSPACE}/nixos/" /tmp/output/nixos/nixos-config/
          # Record kernelrelease
          strings /tmp/kernel-artifact/Image 2>/dev/null | grep -m1 'Linux version' | sed 's/^Linux version \([^ ]*\).*/\1/' > /tmp/output/nixos/kernelrelease 2>/dev/null || true
          # Include flake.lock if generated
          ls -la /tmp/output/nixos/nixos-config/flake.lock 2>/dev/null || true

      - name: Build ramdisk
        run: |
          # Minimal static BusyBox initramfs so boot.img has a valid ramdisk
          chmod +x scripts/build-busybox-arm64.sh scripts/build-diagnostic-initramfs.sh
          bash scripts/build-busybox-arm64.sh --out /tmp/busybox-out
          bash scripts/build-diagnostic-initramfs.sh \
            --init initramfs/init \
            --busybox-root /tmp/busybox-out/applet-root \
            --out /tmp/initramfs-out
          ls -la /tmp/initramfs-out/

      - name: Create boot image
        run: |
          # Assemble Android boot image from NixOS artifacts
          if [[ -f /tmp/kernel-artifact/Image && -f /tmp/initramfs-out/initramfs.cpio.gz ]]; then
            python3 scripts/build-boot-image.py \
              --kernel /tmp/kernel-artifact/Image \
              --ramdisk /tmp/initramfs-out/initramfs.cpio.gz \
              --dtb /tmp/kernel-artifact/sm6125-xiaomi-laurel-sprout.dtb \
              --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=laurel_sprout" \
              --out /tmp/output/nixos/boot.img || {
                echo "NOTE: boot image assembly requires build-boot-image.py"
              }
          fi

      - name: Upload NixOS artifacts
        # actions/upload-artifact@v4.9.5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-${{ inputs.build_variant || 'console' }}
          path: |
            /tmp/output/nixos/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload flake.lock
        if: hashFiles('nixos/flake.lock') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-flake-lock
          path: nixos/flake.lock
          retention-days: 7

      - name: Generate checksums and manifest
        run: |
          set -Eeuo pipefail
          cd /tmp/output/nixos
          # SHA256 of all artifacts
          find . -type f -not -name 'SHA256SUMS' -not -name 'manifest.json' \
            -exec sha256sum {} + > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS
          # Read kernel version from Image
          KERNELRELEASE="$(cat kernelrelease 2>/dev/null || strings Image 2>/dev/null | grep -m1 '^Linux version' | sed 's/^Linux version \([^ ]*\).*/\1/' || echo 'unknown')"
          jq -n \
            --arg variant "${{ inputs.build_variant || 'console' }}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg kernelrelease "$KERNELRELEASE" \
            '{distro:"nixos", variant:$variant, kernelrelease:$kernelrelease, generated_at:$date}' > manifest.json
          cat manifest.json

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-diagnostic
          path: /tmp/nix-*.log
          retention-days: 3
          if-no-files-found: ignore
