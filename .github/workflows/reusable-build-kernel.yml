name: Reusable Build Kernel

on:
  workflow_call:
    inputs:
      build_variant:
        description: 'debug or release'
        required: true
        type: string
      kernel_commit:
        description: 'Kernel commit SHA (leave empty for sources.lock.json default)'
        required: false
        type: string
        default: ''
      kernel_source:
        description: 'Kernel source (linux-mainline-v7.1 or sm6125-mainline-linux)'
        required: false
        type: string
        default: 'linux-mainline-v7.1'
      upload_artifacts:
        description: 'Upload build artifacts'
        required: false
        type: boolean
        default: true
    outputs:
      kernel_commit:
        description: 'The kernel commit that was built'
        value: ${{ jobs.build.outputs.kernel_commit }}
      kernel_version:
        description: 'The kernel version string'
        value: ${{ jobs.build.outputs.kernel_version }}
      dtb_name:
        description: 'Name of the DTB file'
        value: 'sm6125-xiaomi-laurel-sprout.dtb'
    secrets:
      GH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: kernel-reusable-${{ inputs.build_variant || 'debug' }}
  cancel-in-progress: true

jobs:
  build:
    name: "Kernel ${{ inputs.build_variant || 'debug' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      kernel_commit: ${{ steps.kcommit.outputs.commit }}
      kernel_version: ${{ steps.kversion.outputs.version }}
    steps:
      - name: Runner info
        run: |
          set -Eeuo pipefail
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"
          echo "::group::uname -a"; uname -a; echo "::endgroup::"

      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            crossbuild-essential-arm64 device-tree-compiler \
            flex bison libssl-dev libelf-dev bc python3 \
            cpio zstd xz-utils kmod

      - name: Determine kernel commit
        id: kcommit
        run: |
          set -Eeuo pipefail
          KC="${{ inputs.kernel_commit || '' }}"
          if [[ -z "$KC" ]]; then
            KC="$(jq -r ".sources[] | select(.name==\"${{ inputs.kernel_source }}\") | .commit // empty" sources.lock.json || true)"
          fi
          if [[ -z "$KC" || "$KC" == "null" ]]; then
            echo "ERROR: no kernel_commit and no pinned commit in sources.lock.json for ${{ inputs.kernel_source }}" >&2
            exit 1
          fi
          echo "commit=$KC" >> "$GITHUB_OUTPUT"
          echo "Using kernel commit: $KC"

      - name: Clone kernel source (shallow at pinned commit)
        run: |
          set -Eeuo pipefail
          KC="${{ steps.kcommit.outputs.commit }}"
          git clone --filter=blob:none --no-checkout \
            https://github.com/torvalds/linux.git kernel
          cd kernel
          git fetch --depth 1 origin "$KC"
          git checkout -q "$KC"
          echo "Tree at: $(git rev-parse HEAD)"

      - name: Apply downstream patches
        run: |
          set -Eeuo pipefail
          bash scripts/apply-kernel-patches.sh kernel

      - name: Prepare Kconfig fragments
        run: |
          set -Eeuo pipefail
          VARIANT="${{ inputs.build_variant || 'debug' }}"
          FRAGS="configs/kernel/laurel-base.fragment"
          if [[ "$VARIANT" == "debug" ]]; then
            FRAGS="$FRAGS configs/kernel/laurel-debug.fragment"
          else
            FRAGS="$FRAGS configs/kernel/laurel-release.fragment"
          fi
          echo "$FRAGS" > /tmp/frags.txt
          cat /tmp/frags.txt

      - name: Build kernel
        run: |
          set -Eeuo pipefail
          VARIANT="${{ inputs.build_variant || 'debug' }}"
          FRAGS=$(cat /tmp/frags.txt)
          bash scripts/build-kernel.sh \
            --tree kernel \
            --variant "$VARIANT" \
            --fragments $FRAGS \
            --deny-list configs/kernel/laurel-deny.fragment \
            --out /tmp/kernel-out

      - name: Verify Kconfig
        run: |
          set -Eeuo pipefail
          VARIANT="${{ inputs.build_variant || 'debug' }}"
          FRAGS="configs/kernel/laurel-base.fragment"
          if [[ "$VARIANT" == "debug" ]]; then
            FRAGS="$FRAGS configs/kernel/laurel-debug.fragment"
          else
            FRAGS="$FRAGS configs/kernel/laurel-release.fragment"
          fi
          bash scripts/verify-kconfig.sh \
            --config /tmp/kernel-out/kernel.config \
            --tree kernel \
            --fragments $FRAGS \
            --deny-list configs/kernel/laurel-deny.fragment \
            --fail-missing \
            --fail-deny

      - name: Verify DTB
        run: |
          set -Eeuo pipefail
          if [[ -f /tmp/kernel-out/sm6125-xiaomi-laurel-sprout.dtb ]]; then
            bash scripts/verify-dtb.sh \
              --dtb /tmp/kernel-out/sm6125-xiaomi-laurel-sprout.dtb \
              --out /tmp/dtb-report
            cat /tmp/dtb-report/dtb-report.md
          else
            echo "WARNING: laurel DTB not generated"
          fi

      - name: Get kernel version
        id: kversion
        run: |
          set -Eeuo pipefail
          VERSION=$(cat /tmp/kernel-out/kernelrelease 2>/dev/null || echo "unknown")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Kernel version: $VERSION"

      - name: Compress modules and DTB
        run: |
          set -Eeuo pipefail
          cd /tmp/kernel-out
          tar --zstd -cf modules.tar.zst -C modules/lib/modules . 2>/dev/null || tar -cJf modules.tar.zst -C modules/lib/modules . 2>/dev/null || true
          if [[ -f sm6125-xiaomi-laurel-sprout.dtb ]]; then
            tar --zstd -cf dtb.tar.zst sm6125-xiaomi-laurel-sprout.dtb
          fi
          ls -la

      - name: Generate checksums and manifest
        run: |
          set -Eeuo pipefail
          cd /tmp/kernel-out
          sha256sum Image Image.gz System.map kernel.config modules-manifest.txt build.log 2>/dev/null > SHA256SUMS || true
          if [[ -f sm6125-xiaomi-laurel-sprout.dtb ]]; then
            sha256sum sm6125-xiaomi-laurel-sprout.dtb >> SHA256SUMS
          fi
          sha256sum modules.tar.zst dtb.tar.zst 2>/dev/null >> SHA256SUMS || true
          jq -n \
            --arg variant "${{ inputs.build_variant || 'debug' }}" \
            --arg commit "${{ steps.kcommit.outputs.commit }}" \
            --arg version "${{ steps.kversion.outputs.version }}" \
            --arg source "${{ inputs.kernel_source }}" \
            '{artifact:"kernel", variant:$variant, kernel_commit:$commit, kernel_version:$version, source:$source, generated_at:"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > manifest.json
          cat SHA256SUMS
          cat manifest.json

      - name: Upload kernel artifacts
        if: ${{ inputs.upload_artifacts != false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-${{ inputs.build_variant || 'debug' }}
          path: |
            /tmp/kernel-out/Image
            /tmp/kernel-out/Image.gz
            /tmp/kernel-out/System.map
            /tmp/kernel-out/kernel.config
            /tmp/kernel-out/kernelrelease
            /tmp/kernel-out/modules-manifest.txt
            /tmp/kernel-out/sm6125-xiaomi-laurel-sprout.dtb
            /tmp/kernel-out/modules.tar.zst
            /tmp/kernel-out/dtb.tar.zst
            /tmp/kernel-out/build.log
            /tmp/kernel-out/SHA256SUMS
            /tmp/kernel-out/manifest.json
            /tmp/kernel-out/kconfig-setup.log
            /tmp/kernel-out/kconfig-merge.log
          retention-days: 7

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-reusable-diagnostic
          path: |
            /tmp/kernel-out/*.log
            *.log
          retention-days: 3
          if-no-files-found: ignore
