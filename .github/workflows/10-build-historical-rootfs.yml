name: 10-build-historical-rootfs

# Reproduce el ROOTFS HISTÓRICO del port postmarketOS xiaomi-laurel
# (dic 2022): pmbootstrap 1.52.0 + pmaports @7aaee51a + canal "edge"
# redirigido por --config-channels a los repos binarios v22.12 (Alpine
# v3.17). Genera la imagen ext4 de system (xiaomi-laurel.img) y el boot.img
# vía export, listos para auditar y (más adelante, con autorización) flashear.
#
# El kernel linux-postmarketos-qcom-sm6125 (6.1 @77de535b) NO está en el repo
# binario v22.12: pmbootstrap lo compila desde el APKBUILD congelado en modo
# pmb:cross-native (nativo x86_64 con gcc-aarch64, sin qemu).
#
# NO flashea nada. Fuentes fijadas en sources.lock.json.

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Subir artefactos (rootfs y reportes)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-historical-rootfs
  cancel-in-progress: true

jobs:
  rootfs:
    name: Reproducir rootfs histórico (pmbootstrap 1.52.0, canal v22.12)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Info del runner
        run: |
          set -Eeuo pipefail
          echo "::group::df -h"; df -h; echo "::endgroup::"
          echo "::group::free -h"; free -h; echo "::endgroup::"
          echo "::group::uname -a"; uname -a; echo "::endgroup::"
          nproc
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Instalar dependencias host
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3 python3-pip git openssl coreutils procps \
            tar curl xz-utils jq file \
            qemu-user-static binfmt-support \
            e2fsprogs util-linux
      - name: Descargar y verificar pmbootstrap 1.52.0
        run: |
          set -Eeuo pipefail
          URL="https://gitlab.postmarketos.org/postmarketOS/pmbootstrap/-/archive/1.52.0/pmbootstrap-1.52.0.tar.gz"
          curl -fsSL "$URL" -o /tmp/pmbootstrap-1.52.0.tar.gz
          echo "a05fef2bb495a2e0d8e0369e4a8a1038baf50b7514ec89582b5ec785f9bfa7cb  /tmp/pmbootstrap-1.52.0.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pmbootstrap-1.52.0.tar.gz -C /tmp
          mv /tmp/pmbootstrap-1.52.0 /tmp/pmbootstrap
          test -x /tmp/pmbootstrap/pmbootstrap.py
          echo "pmbootstrap listo"
      - name: Clonar pmaports congelado @7aaee51a (rama master)
        run: |
          set -Eeuo pipefail
          KC=7aaee51a
          # GitLab rechaza fetch de SHAs sueltos (allowAnySHA1InWant off).
          # 7aaee51a es ancestro de master (MR 3727, fast-forward), asi que
          # un clone blob:none de master ya lo incluye y checkout directo basta.
          git clone --filter=blob:none --no-checkout \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git /tmp/pmaports
          git -C /tmp/pmaports checkout -q "$KC"
          test "$(git -C /tmp/pmaports rev-parse HEAD)" = "$(git -C /tmp/pmaports rev-parse "$KC")"
          git -C /tmp/pmaports checkout -q -b master
          git -C /tmp/pmaports rev-parse HEAD
          grep '^channel=' /tmp/pmaports/pmaports.cfg
      - name: "Workaround local: gcc-aarch64 r5 -> r4"
        run: |
          set -Eeuo pipefail
          # El árbol congelado @7aaee51a (diciembre 2022) trae
          # cross/gcc-aarch64 pkgrel=5, cuyos subpaquetes (p.ej. g++) pinnean
          # libstdc++=12.2.1_git20220924-r5. Alpine v3.17 actual solo
          # proporciona libstdc++ r4, por lo que el r5 es ininstalable (apk
          # exit 3). El repo binario v22.12 (mirror) tiene gcc-aarch64 r4,
          # consistente con libstdc++ r4. Revertir a pkgrel=4 hace que
          # pmbootstrap use el cross-compiler binario r4 (no lo recompila) y
          # que g++-aarch64 r4 resuelva contra libstdc++ r4 existente.
          APK=/tmp/pmaports/cross/gcc-aarch64/APKBUILD
          grep -n '^pkgrel=' "$APK"
          sed -i 's/^pkgrel=5$/pkgrel=4/' "$APK"
          grep -n '^pkgrel=' "$APK"
      - name: Escribir pmbootstrap.cfg
        run: |
          set -Eeuo pipefail
          cat > /tmp/pmbootstrap.cfg <<'EOF'
          [pmbootstrap]
          aports = /tmp/pmaports
          work = /home/runner/.local/var/pmbootstrap
          device = xiaomi-laurel
          kernel = postmarketos-qcom-sm6125
          ui = console
          user = pmos
          hostname = laziel
          timezone = UTC
          locale = en_US.UTF-8
          mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
          mirrors_postmarketos = http://mirror.postmarketos.org/postmarketos/
          nonfree_firmware = True
          nonfree_userland = False
          extra_packages = none
          build_pkgs_on_install = True
          is_default_channel = False
          boot_size = 64
          extra_space = 1024
          ccache_size = 256M
          sudo_timer = False
          qemu_redir_stdio = False
          ssh_keys = False
          [providers]
          EOF
          sed -i "s/^jobs = .*/jobs = $(nproc)/" /tmp/pmbootstrap.cfg || \
            sed -i '/^\[pmbootstrap\]$/a jobs = '"$(nproc)" /tmp/pmbootstrap.cfg
          grep -E '^(device|kernel|ui|mirrors_postmarketos|mirror_alpine|jobs|boot_size|extra_space) =' /tmp/pmbootstrap.cfg
      - name: Inicializar pmbootstrap (no interactivo, canal congelado)
        run: |
          set -Eeuo pipefail
          # ask() usa input() y NO captura EOFError (en CI el stdin es EOF y
          # init fallaría). Generamos un archivo con muchas líneas vacías:
          # cada prompt consume una línea y devuelve el default (los valores
          # correctos ya vienen del --config). -y hace que confirm() devuelva
          # el default.
          # IMPORTANTE: no usar 'yes | pmbootstrap' en el pipeline: con
          # pipefail el SIGPIPE de yes (exit 141) ensucia el exit code del
          # paso aunque pmbootstrap termine OK. Alimentamos stdin desde
          # archivo y capturamos el exit code real de pmbootstrap.
          yes "" | head -n 2000 > /tmp/init-answers.txt || true
          wc -l /tmp/init-answers.txt
          /tmp/pmbootstrap/pmbootstrap.py -y \
            --config /tmp/pmbootstrap.cfg \
            --config-channels "$GITHUB_WORKSPACE/config/pmos-historical-channels.cfg" \
            --aports /tmp/pmaports \
            init < /tmp/init-answers.txt > /tmp/init.log 2>&1
          rc=$?
          tail -30 /tmp/init.log
          echo "pmbootstrap init exit=$rc"
          exit $rc
      - name: Verificar canal y repos resueltos
        run: |
          set -Eeuo pipefail
          /tmp/pmbootstrap/pmbootstrap.py \
            --config /tmp/pmbootstrap.cfg \
            --config-channels "$GITHUB_WORKSPACE/config/pmos-historical-channels.cfg" \
            status < /tmp/init-answers.txt 2>&1 | head -30 || true
          echo "---"
          cat /home/runner/.local/var/pmbootstrap/cache_git/pmaports/channels.cfg 2>/dev/null || true
          echo "channels.cfg congelado verificado en workflow, ver arriba"
      - name: Compilar kernel histórico (pmb:cross-native, sin qemu)
        run: |
          set -Eeuo pipefail
          PMB() {
            /tmp/pmbootstrap/pmbootstrap.py -y \
              --config /tmp/pmbootstrap.cfg \
              --config-channels "$GITHUB_WORKSPACE/config/pmos-historical-channels.cfg" \
              "$@"
          }
          # gcc-aarch64 ya es r4 en el árbol (workaround del paso anterior),
          # coincidiendo con el repo binario v22.12: pmbootstrap usa el binario
          # y no recompila; g++-aarch64 r4 y libstdc++ r4 resuelven contra
          # Alpine v3.17. El paso de instalación reindexa el repo local antes
          # de instalar, para resolver el kernel recién construido.
          PMB build linux-postmarketos-qcom-sm6125 < /tmp/init-answers.txt 2>&1 | tee /tmp/kernel-build.log
          echo "== tail =="
          tail -15 /tmp/kernel-build.log
          echo "== apk generado =="
          # No recorrer el chroot con find: /proc, /root y /lib/apk/exec del
          # chroot_native dan Permission denied y find sale con exit 1 (se
          # dispara set -e y el paso falla aunque el kernel compiló OK).
          # Se busca solo en el repo local de paquetes (host).
          find /home/runner/.local/var/pmbootstrap/packages \
            -name 'linux-postmarketos-qcom-sm6125-*.apk' \
            -exec ls -la {} \; 2>/dev/null || true
      - name: Liberar espacio (limpiar builddir y distfiles del kernel)
        if: always()
        run: |
          set -Eeuo pipefail
          /tmp/pmbootstrap/pmbootstrap.py -y \
            --config /tmp/pmbootstrap.cfg \
            --config-channels "$GITHUB_WORKSPACE/config/pmos-historical-channels.cfg" \
            chroot -- rm -rf /home/pmos/build/linux-postmarketos-qcom-sm6125 /var/cache/distfiles/* < /tmp/init-answers.txt 2>&1 | tail -3 || true
          df -h /
      - name: Instalar rootfs histórico
        run: |
          set -Eeuo pipefail
          PMB() {
            /tmp/pmbootstrap/pmbootstrap.py -y \
              --config /tmp/pmbootstrap.cfg \
              --config-channels "$GITHUB_WORKSPACE/config/pmos-historical-channels.cfg" \
              "$@"
          }
          # Refrescar APKINDEX local antes de instalar: si install recompila
          # paquetes desactualizados, apk debe resolverlos consistentemente
          # desde el repo local.
          PMB index < /tmp/init-answers.txt 2>&1 | tail -20 | tee /tmp/pmbootstrap-index-install.log
          # --password evita el prompt de passwd: sin el flag, pmbootstrap 1.52.0
          # intenta fijar la clave del usuario pmos en bucle infinito ("Failed to
          # set the password. Try it one more time.") porque nuestro stdin de
          # líneas vacías siempre la hace fallar -> el job colgaba hasta el
          # timeout de 360 min (run 31252993573). Con --password usa chpasswd
          # (no interactivo). Es clave de prueba (rootfs desechable, slot b).
          # extra_space=1024 (config): el du del chroot subestima el rootfs
          # (kernel 6.1 con módulos + cache apk) y con 256 MB la imagen de
          # 1034M se llenaba al copiar (No space left on device, pmbootstrap#1904).
          PMB install --no-sshd --no-fde --password "147147" < /tmp/init-answers.txt 2>&1 | tee /tmp/install.log
          echo "== tail =="
          tail -25 /tmp/install.log
          echo "== rootfs images =="
          ls -la /home/runner/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs/
      - name: Exportar boot.img y rootfs
        run: |
          set -Eeuo pipefail
          WORK=/home/runner/.local/var/pmbootstrap
          rm -rf /tmp/export && mkdir -p /tmp/export
          /tmp/pmbootstrap/pmbootstrap.py -y \
            --config /tmp/pmbootstrap.cfg \
            --config-channels "$GITHUB_WORKSPACE/config/pmos-historical-channels.cfg" \
            export --no-install /tmp/export < /tmp/init-answers.txt 2>&1 | tail -20
          echo "== /tmp/export (symlinks) =="
          ls -la /tmp/export/
          # Resolver symlinks (apuntan a archivos dentro de chroots) a archivos
          # reales, para subir y auditar.
          mkdir -p /tmp/export-resolved
          for f in /tmp/export/*; do
            [ -e "$f" ] || continue
            cp -aL "$f" "/tmp/export-resolved/$(basename "$f")"
          done
          echo "== /tmp/export-resolved =="
          ls -la /tmp/export-resolved/
      - name: Validar rootfs (MBR + particiones ext2/ext4 via dd)
        run: |
          set -Eeuo pipefail
          WORK=/home/runner/.local/var/pmbootstrap
          IMG="$WORK/chroot_native/home/pmos/rootfs/xiaomi-laurel.img"
          if [[ ! -f "$IMG" ]]; then
            echo "ERROR: no existe $IMG"
            ls -la "$WORK/chroot_native/home/pmos/rootfs/" || true
            exit 1
          fi
          echo "IMG=$IMG"
          stat -c 'size=%s bytes (sparse)' "$IMG"
          # Deshacer sparse dentro del chroot nativo (android-tools se instaló
          # durante install para img2simg).
          /tmp/pmbootstrap/pmbootstrap.py -y \
            --config /tmp/pmbootstrap.cfg \
            --config-channels "$GITHUB_WORKSPACE/config/pmos-historical-channels.cfg" \
            chroot -- simg2img /home/pmos/rootfs/xiaomi-laurel.img /home/pmos/rootfs/xiaomi-laurel.raw < /tmp/init-answers.txt 2>&1 | tail -5
          RAW="$WORK/chroot_native/home/pmos/rootfs/xiaomi-laurel.raw"
          test -f "$RAW" || { echo "ERROR: simg2img no produjo raw"; exit 1; }
          stat -c 'raw size=%s bytes' "$RAW"
          file "$RAW"
          # deviceinfo_rootfs_image_sector_size=4096 -> losetup -b 4096 y parted
          # escriben el MBR con LBA en sectores de 4096 bytes (el eMMC del
          # laurel_sprout es 4Kn). El dd debe usar ese bs, no 512.
          SECTOR=$(grep '^deviceinfo_rootfs_image_sector_size=' \
            /tmp/pmaports/device/testing/device-xiaomi-laurel/deviceinfo \
            | cut -d'"' -f2)
          SECTOR=${SECTOR:-512}
          echo "SECTOR=$SECTOR"
          python3 - "$RAW" "$SECTOR" <<'PY'
          import struct, sys, subprocess
          raw, sector = sys.argv[1], int(sys.argv[2])
          with open(raw, "rb") as fh:
              d = fh.read(512)
          if d[510:512] != b"\x55\xaa":
              sys.exit("ERROR: no es imagen MBR (falta firma 0x55aa)")
          parts = []
          for i in range(4):
              e = d[446 + i * 16 : 446 + i * 16 + 16]
              _, _, ptype, _, start, size = struct.unpack("<B3sB3sII", e)
              if ptype == 0 or size == 0:
                  continue
              parts.append((i + 1, ptype, start, size))
          print("Particiones MBR (LBA en sectores de {} bytes): {}".format(
              sector, parts))
          if len(parts) < 2:
              sys.exit("ERROR: se esperaban al menos 2 particiones")
          for num, ptype, start, size in parts:
              out = "/tmp/part{}.img".format(num)
              subprocess.run(["dd", "if=" + raw, "of=" + out,
                              "bs={}".format(sector),
                              "skip={}".format(start), "count={}".format(size),
                              "status=none"], check=True)
              print("p{}: type=0x{:02x} start={} sectors={} ({} bytes) -> {}".format(
                  num, ptype, start, size, start * sector, out))
          PY
          file /tmp/part1.img /tmp/part2.img
          echo "== e2fsck partición boot (p1, ext2) =="
          sudo e2fsck -f -n /tmp/part1.img
          echo "== e2fsck partición root (p2, ext4) =="
          sudo e2fsck -f -n /tmp/part2.img
          echo "== /etc/os-release (root p2) =="
          debugfs -R "cat /etc/os-release" /tmp/part2.img 2>/dev/null || true
          echo "== /lib/apk/db/installed (paquetes clave, root p2) =="
          debugfs -R "cat /lib/apk/db/installed" /tmp/part2.img 2>/dev/null | grep -E '^P:' | grep -iE 'postmarketos|mkbootimg|boot-deploy|device-|linux-' | sort || true
          echo "== / (partición boot p1) =="
          debugfs -R "ls -l /" /tmp/part1.img 2>/dev/null || true
      - name: Generar manifest y reporte
        run: |
          set -Eeuo pipefail
          WORK=/home/runner/.local/var/pmbootstrap
          IMG="$WORK/chroot_native/home/pmos/rootfs/xiaomi-laurel.img"
          test -f "$IMG" || { echo "ERROR: no existe $IMG"; exit 1; }
          mkdir -p /tmp/artifacts
          # checksums
          (cd /tmp/export-resolved && sha256sum * 2>/dev/null | tee /tmp/artifacts/SHA256SUMS-export)
          sha256sum "$IMG" "$WORK/chroot_native/home/pmos/rootfs/xiaomi-laurel.raw" | tee /tmp/artifacts/SHA256SUMS-rootfs
          sha256sum /tmp/part1.img /tmp/part2.img | tee /tmp/artifacts/SHA256SUMS-partitions
          # manifest
          jq -n \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run "${{ github.run_id }}" \
            --arg img "$(basename "$IMG")" \
            --arg imgsize "$(stat -c %s "$IMG")" \
            '{artifact:"historical-rootfs",
              generated_at:$date, run_id:$run,
              pmbootstrap:"1.52.0 (sha256 a05fef2bb495a2e0d8e0369e4a8a1038baf50b7514ec89582b5ec785f9bfa7cb)",
              pmaports:"7aaee51a (2022-12-14, MR 3727)",
              kernel:"linux-postmarketos-qcom-sm6125 6.1 @77de535b8dbd8f483b5802c8937cb714bab5b485",
              channel:"edge->v22.12 (Alpine v3.17)",
              mirrors:{pmos:"http://mirror.postmarketos.org/postmarketos/v22.12/", alpine:"http://dl-cdn.alpinelinux.org/alpine/v3.17/"},
              image:$img, image_bytes:($imgsize|tonumber),
               layout:"MBR (msdos): p1 /boot ext2, p2 / ext4, flash_rootfs a system_b",
               flash_target:"system_b (tamaño real a confirmar en FASE 8 con 'fastboot getvar partition-size:system_b'; referencia stock ~3 GiB, no verificado aún)"}' \
            > /tmp/artifacts/manifest.json
          cat /tmp/artifacts/manifest.json
      - name: Reporte markdown
        run: |
          set -Eeuo pipefail
          IMG=/home/runner/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs/xiaomi-laurel.img
          {
            echo "# Reproducción del rootfs histórico (FASE 3)"
            echo
            echo "- pmbootstrap: 1.52.0 (sha256 \`a05fef2b…\`)"
            echo "- pmaports: \`7aaee51a\` (2022-12-14, MR 3727, port xiaomi-laurel)"
            echo "- Canal: \`edge\` redirigido a repos v22.12 (Alpine v3.17) via config/pmos-historical-channels.cfg"
            echo "- Kernel: linux-postmarketos-qcom-sm6125 6.1 @\`77de535b\` (pmb:cross-native)"
            echo "- Imagen: \`$IMG\` (sparse, MBR: p1 /boot ext2, p2 / ext4)"
            stat -c "- Tamaño sparse: %s bytes" "$IMG"
            echo
            echo "## /etc/os-release (partición root p2)"
            echo '```'
            debugfs -R "cat /etc/os-release" /tmp/part2.img 2>/dev/null
            echo '```'
            echo
            echo "## / (partición boot p1)"
            echo '```'
            debugfs -R "ls -l /" /tmp/part1.img 2>/dev/null
            echo '```'
            echo
            echo "## Paquetes postmarketOS/laurel instalados"
            echo '```'
            debugfs -R "cat /lib/apk/db/installed" /tmp/part2.img 2>/dev/null | grep -E '^P:' | grep -iE 'postmarketos|mkbootimg|boot-deploy|device-|linux-' | sort
            echo '```'
          } > /tmp/artifacts/historical-rootfs-report.md
          cat /tmp/artifacts/historical-rootfs-report.md
      - name: Comprimir rootfs
        run: |
          set -Eeuo pipefail
          IMG=/home/runner/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs/xiaomi-laurel.img
          test -f "$IMG" || { echo "ERROR: no existe $IMG"; exit 1; }
          cp "$IMG" /tmp/artifacts/
          xz -9 -T0 -k /tmp/artifacts/"$(basename "$IMG")"
          cp /tmp/part1.img /tmp/part2.img /tmp/artifacts/
          ls -la /tmp/artifacts/
      - name: Subir artefactos
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-rootfs
          path: |
            /tmp/artifacts/
            /tmp/export-resolved/
          retention-days: 3
      - name: Subir logs de diagnóstico (siempre)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-rootfs-logs
          path: |
            /tmp/kernel-build.log
            /tmp/install.log
            /tmp/pmbootstrap-index-install.log
            /tmp/pmbootstrap*.log
            /home/runner/.local/var/pmbootstrap/log.txt
            *.log
          retention-days: 3
          if-no-files-found: ignore
