name: Nixos Build Console (Closure)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nixos-build-console
  cancel-in-progress: true

jobs:
  build-and-export-console:
    name: "Build + export closure (aarch64-linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BUILD_VARIANT: console
    steps:
      - name: Runner info
        run: |
          df -h
          free -h

      # actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # DeterminateSystems/nix-installer-action@v16
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d
        with:
          daemon: true
          extra-conf: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux

      - name: Verify committed flake.lock (flake.lock is REQUIRED, never auto-updated)
        run: |
          set -Eeuo pipefail
          test -f nixos/flake.lock || {
            echo "FALLO: falta nixos/flake.lock versionado (el CI nunca la regenera)" >&2
            exit 1
          }
          echo "nixpkgs rev fijado: $(jq -r '.nodes.nixpkgs.locked.rev' nixos/flake.lock)"

      - name: Enable aarch64 cross-build (qemu/binfmt, cached binary deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64

      # Build REAL de la closure. Sin --impure, sin kernel rebuild/download,
      # sin acciones destructivas. Un fallo => job fallido.
      # flake.lock ya está commiteado; la ruta build-toplevel es la de siempre.
      - name: Build NixOS toplevel (closure real)
        run: |
          set -Eeuo pipefail
          nix build \
            ./nixos#nixosConfigurations.laurel-console.config.system.build.toplevel \
            --out-link result-console \
            --print-build-logs

      - name: Assert closure produit
        run: |
          set -Eeuo pipefail
          test -L result-console || { echo "FALLO: falta result-console" >&2; exit 1; }
          SYSTEM_PATH="$(readlink -f result-console)"
          test -d "$SYSTEM_PATH" || { echo "FALLO: sistema no es directorio" >&2; exit 1; }
          test -x "$SYSTEM_PATH/init" || { echo "FALLO: falta init ejecutable" >&2; exit 1; }
          echo "systemPath=$SYSTEM_PATH"

      - name: Verify and export closure (reproducible)
        run: |
          set -Eeuo pipefail
          chmod +x scripts/export-nixos-closure.sh
          scripts/export-nixos-closure.sh \
            --out-link result-console \
            --out artifacts/nixos-console

      - name: Upload closure artifacts
        # actions/upload-artifact@v4.9.5
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-console-closure
          path: artifacts/nixos-console/**/*
          retention-days: 7
          if-no-files-found: error

      # Diagnóstico solo en fallo (nunca contamina producto)
      - name: Upload diagnostic logs
        if: failure()
        # actions/upload-artifact@v4.9.5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-build-console-diagnostic
          path: |
            *.log
          retention-days: 3
          if-no-files-found: ignore

  # Fase 3B: re-import del export + árbol rootfs en directorio (sin ext4 aún)
  assemble-rootfs-tree:
    name: "Assemble rootfs tree (3B)"
    needs: build-and-export-console
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Disk baseline
        run: df -h /nix / 2>/dev/null || df -h /

      # actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download closure export
        # actions/download-artifact@v4.3.3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nixos-console-closure
          path: artifacts/nixos-console

      # DeterminateSystems/nix-installer-action@v16
      - name: Install Nix (for nix-store --import)
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Assemble and validate rootfs tree
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build-nixos-rootfs-tree.sh
          scripts/build-nixos-rootfs-tree.sh \
            --nar artifacts/nixos-console/nixos-laurel-console-closure.nar.zst \
            --paths artifacts/nixos-console/closure-paths.txt \
            --out rootfs-tree

      - name: Package rootfs tree archive
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts-3b
          tar -cf - -C rootfs-tree . | zstd -T0 -19 -q -o artifacts-3b/rootfs-tree.tar.zst
          cp rootfs-tree/validation.json artifacts-3b/validation.json
          sha256sum artifacts-3b/rootfs-tree.tar.zst

      - name: Upload rootfs tree archive
        # actions/upload-artifact@v4.9.5
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-console-rootfs-tree
          path: |
            artifacts-3b/rootfs-tree.tar.zst
            artifacts-3b/validation.json
          retention-days: 7
          if-no-files-found: error

  # Fase 3C: imagen ext4 NIXOS_ROOT desde el árbol 3B (sin hardware)
  create-rootfs-image:
    name: "Create + verify ext4 NIXOS_ROOT image (3C)"
    needs: assemble-rootfs-tree
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Disk baseline
        run: df -h /nix / 2>/dev/null || df -h /

      # actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download rootfs tree (3B)
        # actions/download-artifact@v4.3.3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nixos-console-rootfs-tree
          path: artifacts-3b

      - name: Extract rootfs tree
        run: |
          set -Eeuo pipefail
          mkdir -p rootfs-tree
          tar -xf artifacts-3b/rootfs-tree.tar.zst -C rootfs-tree
          jq . rootfs-tree/validation.json

      - name: Create and verify ext4 NIXOS_ROOT image
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build-nixos-rootfs-image.sh
          mkdir -p artifacts-3c
          scripts/build-nixos-rootfs-image.sh \
            --tree rootfs-tree \
            --out artifacts-3c/nixos-rootfs.img \
            --label NIXOS_ROOT

      - name: Upload rootfs image
        # actions/upload-artifact@v4.9.5
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-console-rootfs-image
          path: artifacts-3c/
          retention-days: 7
          if-no-files-found: error

  # Fase 3D: kernel v7.1 compartido (NO reconstruir por iteración de rootfs)
  build-kernel:
    name: "Build shared kernel v7.1 (for NixOS boot.img)"
    uses: ./.github/workflows/reusable-build-kernel.yml
    with:
      build_variant: release
      kernel_source: linux-mainline-v7.1

  # Fase 3D: busybox estático ARM64 para el initramfs
  build-busybox:
    name: "Build static busybox (aarch64)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq crossbuild-essential-arm64

      - name: Build busybox
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build-busybox-arm64.sh
          scripts/build-busybox-arm64.sh --out /tmp/busybox-out
          file /tmp/busybox-out/busybox

      - name: Upload busybox
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-console-busybox
          path: /tmp/busybox-out/busybox
          retention-days: 7
          if-no-files-found: error

  # Fase 3D: initramfs (uinit) + boot.img con cmdline stage-2 de NixOS
  build-boot-image:
    name: "Build NixOS initramfs + boot.img (3D)"
    needs: [build-and-export-console, assemble-rootfs-tree, build-kernel, build-busybox]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download kernel (v7.1 shared)
        # actions/download-artifact@v4.3.3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kernel-release
          path: /tmp/kernel-artifact

      - name: Download busybox (aarch64)
        # actions/download-artifact@v4.3.3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nixos-console-busybox
          path: /tmp/busybox

      - name: Download rootfs tree (3B) for systemPath
        # actions/download-artifact@v4.3.3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nixos-console-rootfs-tree
          path: artifacts-3b

      - name: Build NixOS initramfs
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build-nixos-initramfs.sh
          scripts/build-nixos-initramfs.sh \
            --busybox /tmp/busybox/busybox \
            --modules /tmp/kernel-artifact/modules.tar.zst \
            --out /tmp/initramfs-out
          gzip -dc /tmp/initramfs-out/initramfs.cpio.gz | cpio -t | sort > /tmp/initramfs-file-list.txt
          grep -q '/init$' /tmp/initramfs-file-list.txt || grep -q '^\./init$' /tmp/initramfs-file-list.txt || { echo "FALLO: init ausente en initramfs" >&2; exit 1; }
          grep -q '/busybox$' /tmp/initramfs-file-list.txt || grep -q '^\./busybox$' /tmp/initramfs-file-list.txt || { echo "FALLO: busybox ausente en initramfs" >&2; exit 1; }
          grep -c '/lib/modules/' /tmp/initramfs-file-list.txt
          file /tmp/initramfs-out/busybox

      - name: Build + verify boot.img
        run: |
          set -Eeuo pipefail
          SYSTEM_PATH="$(jq -r '.systemPath' artifacts-3b/validation.json)"
          chmod +x scripts/build-nixos-boot-image.sh
          mkdir -p /tmp/boot-out
          scripts/build-nixos-boot-image.sh \
            --kernel /tmp/kernel-artifact/Image \
            --dtb /tmp/kernel-artifact/sm6125-xiaomi-laurel-sprout.dtb \
            --ramdisk /tmp/initramfs-out/initramfs.cpio.gz \
            --system-path "$SYSTEM_PATH" \
            --out /tmp/boot-out/boot-laurel-nixos-console.img \
            --boot-limit 67108864
          CMDLINE_EXTRACTED="$(python3 scripts/unpack-boot-image.py --boot /tmp/boot-out/boot-laurel-nixos-console.img --out /tmp/boot-validation/unpack --print-cmdline)"
          printf '%s\n' "$CMDLINE_EXTRACTED" > /tmp/boot-out/cmdline.txt
          echo "cmdline: $CMDLINE_EXTRACTED"
          grep -q "root=LABEL=NIXOS_ROOT" <<<"$CMDLINE_EXTRACTED" || { echo "FALLO: cmdline sin root=LABEL=NIXOS_ROOT" >&2; exit 1; }
          grep -q "init=/nix/store/" <<<"$CMDLINE_EXTRACTED" || { echo "FALLO: cmdline sin init=/nix/store/..." >&2; exit 1; }

      - name: Boot manifest (3D)
        run: |
          set -Eeuo pipefail
          SIZE="$(stat -c %s /tmp/boot-out/boot-laurel-nixos-console.img)"
          SYSTEM_PATH="$(jq -r '.systemPath' artifacts-3b/validation.json)"
          jq -n \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg system_path "$SYSTEM_PATH" \
            --argjson size_bytes "$(printf '%s' "$SIZE")" \
            --argjson limit_bytes 67108864 \
            --arg cmdline "$(cat /tmp/boot-out/cmdline.txt)" \
            '{fase:"3D", run_id:$run_id, systemPath:$system_path, bootImageBytes:$size_bytes, bootLimitBytes:$limit_bytes, fits:($size_bytes < 67108864), cmdline:$cmdline, hardwareTested:false}' > /tmp/boot-out/boot-manifest.json
          jq . /tmp/boot-out/boot-manifest.json

      - name: Upload boot image (3D)
        # actions/upload-artifact@v4.9.5
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nixos-console-boot
          path: |
            /tmp/boot-out/boot-laurel-nixos-console.img
            /tmp/boot-out/cmdline.txt
            /tmp/boot-out/boot-manifest.json
            /tmp/boot-validation/**/*
            /tmp/initramfs-file-list.txt
            /tmp/initramfs-out/initramfs.cpio.gz
          retention-days: 7
          if-no-files-found: error