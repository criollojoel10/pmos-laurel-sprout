# Modulos que el Mi A3 necesita ya en el initramfs: el panel se enciende antes
# de que exista la rootfs.
#
# Los nombres salen del config del kernel (config-nura-qcom-sm61x5.aarch64
# @ec98dddc) y del Makefile de drivers/gpu/drm/panel, que llama al objeto
# `panel-samsung-s6e8fc0-m1906f9.o` (no `panel-samsung-s6e8fc0`):
#   CONFIG_DRM_MSM=m                              -> msm.ko
#   CONFIG_DRM_PANEL_SAMSUNG_S6E8FC0=m            -> panel-samsung-s6e8fc0-m1906f9.ko
#   CONFIG_TOUCHSCREEN_EDT_FT5X06=m               -> edt_ft5x06.ko
MODULES+=(msm panel-samsung-s6e8fc0-m1906f9 edt_ft5x06)
