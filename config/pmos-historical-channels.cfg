# channels.cfg congelado para la reproducción del rootfs histórico
# (FASE 3). pmbootstrap 1.52.0 lee este archivo con --config-channels en
# lugar de origin/master:channels.cfg del árbol pmaports.
#
# El checkout congelado de pmaports está en el commit 7aaee51a (2022-12-14,
# MR 3727, port xiaomi-laurel con kernel 6.1). Su pmaports.cfg declara
# channel=edge, así que aquí se redefine la canal "edge" para que apunte a
# los repositorios binarios históricos de la era del port:
#
#   branch_pmaports   -> https://mirror.postmarketos.org/postmarketos/v22.12/
#   mirrordir_alpine  -> http://dl-cdn.alpinelinux.org/alpine/v3.17/
#
# Valores tomados literalmente de channels.cfg @7aaee51a (entrada [v22.12]),
# que a su vez corresponde a pmbootstrap 1.52.0 (Alpine v3.12-v3.17+edge).
# Referencia: https://postmarketos.org/channels.cfg

[channels.cfg]
recommended=edge

[edge]
description=Reproducción histórica: pmaports @7aaee51a (port xiaomi-laurel, dic 2022) con repos binarios v22.12 / Alpine v3.17
branch_pmaports=v22.12
branch_aports=3.17-stable
mirrordir_alpine=v3.17

# Entradas históricas conservadas como referencia documental (sin uso activo).
[v22.12]
description=Upcoming stable release (DO NOT USE) - historical reference
branch_pmaports=v22.12
branch_aports=3.17-stable
mirrordir_alpine=v3.17

[v22.06]
description=Latest release / Recommended for best stability (historical reference)
branch_pmaports=v22.06
branch_aports=3.16-stable
mirrordir_alpine=v3.16
